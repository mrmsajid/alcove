<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're offline</title>
  <style>
    /* What a tab shows when there is no internet (main.js loads it on ERR_INTERNET_DISCONNECTED): a tabby asleep in an alcove, under a
       little night window. Hold the cat to pet it (it purrs, softly, out loud); click anywhere else to drop a ball of yarn and it wakes,
       yawns, chases and bats it, then goes home to sleep. When the connection returns the page reloads by itself, after a stretch.
       Self-contained: no network, nothing stored. Everything is drawn on one canvas in 600 x 300 units. */
    :root {
      color-scheme: dark light;
      --bg: #1d1d20; --surface: #232327; --text: #ededf0; --muted: #abaab5; --line: #ffffff2e; --accent: #ff9f5a;
      --wall: #26262b; --floor: #1f1f23; --niche-top: #111114; --niche-bot: #1b1b20; --glow: #ffb36b; --sky-top: #141b3a; --sky-bot: #2c3970;
      --moon: #fff3c4; --cushion: #5c62a3; --cushion-hi: #7a80c4; --edge: rgba(0,0,0,.28);
      --fur: #e7883a; --fur-hi: #f6aa5f; --fur2: #b9581c; --cream: #fde9cf; --ear: #f3a7a2; --iris: #b8d65a; --yarn: #e8556a; --yarn-hi: #ff8a99;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f4f6; --surface: #ffffff; --text: #1c1c1f; --muted: #5a5a64; --line: #00000030; --accent: #d9660f;
        --wall: #f7f4ef; --floor: #ece6dd; --niche-top: #ddd6cc; --niche-bot: #e9e2d8; --glow: #ffcf94; --sky-top: #8fb4ea; --sky-bot: #d5e5fb;
        --moon: #fffbe8; --cushion: #8a90d2; --cushion-hi: #a7acdf; --edge: rgba(80,60,40,.10);
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
    main { width: min(680px, 100%); padding: 24px; text-align: center; }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
    p { margin: 0; color: var(--muted); }
    #stage { margin: 24px 0 18px; border-radius: 18px; background: var(--wall); border: 1px solid var(--line); overflow: hidden; touch-action: manipulation; cursor: pointer; box-shadow: 0 18px 50px #0000002e; }
    #stage:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 600 / 300; }
    .row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    button { font: inherit; padding: 7px 16px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; }
    button:hover { background: var(--surface); }
    button.primary { background: var(--text); color: var(--bg); border-color: transparent; font-weight: 600; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #back { margin-bottom: 14px; color: var(--text); }
    #hint { margin-top: 16px; font-size: 12.5px; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p id="host">Alcove can't reach the internet.</p>
    <div id="stage" tabindex="0" role="application" aria-label="A cat asleep in an alcove. Click and hold the cat to pet it. Click anywhere else, or press Space, to drop a ball of yarn for it.">
      <canvas id="c" width="1200" height="600"></canvas>
    </div>
    <p id="back" hidden>You're back online.</p>
    <div class="row"><button id="retry" class="primary" type="button">Try again</button><button id="yarn" type="button">Drop yarn</button></div>
    <p id="hint">Hold the cat to pet it, or drop some yarn. Alcove reloads the page by itself when the connection returns.</p>
  </main>
  <script>
    const q = new URLSearchParams(location.search);
    const target = /^https?:\/\//i.test(q.get("url") || "") ? q.get("url") : "";
    if (target) { try { document.getElementById("host").textContent = `Alcove can't reach ${new URL(target).hostname}.`; } catch {} }
    const retry = () => { if (target) location.href = target; else history.back(); };
    document.getElementById("retry").addEventListener("click", retry);

    const cv = document.getElementById("c"), g = cv.getContext("2d");
    const W = 600, H = 300, GROUND = 236, HOME = 300, SC = cv.width / W;
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches; // no idle breathing, twinkling or swaying: only what you ask for
    const IDLE = 7000; // how long the cat sits awake before it goes home to sleep (ms)
    let C = {};
    const readColors = () => { const s = getComputedStyle(document.documentElement); for (const k of ["accent", "wall", "floor", "niche-top", "niche-bot", "glow", "sky-top", "sky-bot", "moon", "cushion", "cushion-hi", "fur", "fur-hi", "fur2", "cream", "ear", "iris", "yarn", "yarn-hi", "muted", "edge"]) C[k] = s.getPropertyValue("--" + k).trim(); };
    readColors(); matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);

    // ---- the cat is a small rig: hips, shoulders and a head on a spine, four two-part legs solved to where their paws are, and a tail
    // that is a chain of springs. Each pose is a set of targets; the rig eases toward them, so every change of pose is a smooth motion.
    // Walking plants each paw on the floor for most of its step, so feet don't slide. All in 600 x 300 units, drawn facing right.
    const G = GROUND, R = 11; // R: the yarn's radius
    const POSES = {
      stand:  { hip: [-22, G - 30], sh: [19, G - 31], head: [36, G - 47], tilt: 0, fold: 0, tail: [-2.25, .13] },
      walk:   { hip: [-22, G - 30], sh: [19, G - 31], head: [37, G - 46], tilt: .04, fold: 0, tail: [-2.35, .1] },
      run:    { hip: [-24, G - 29], sh: [21, G - 29], head: [39, G - 40], tilt: .06, fold: 0, tail: [-2.75, .07] },
      crouch: { hip: [-21, G - 22], sh: [17, G - 16], head: [33, G - 25], tilt: 0, fold: 0, tail: [-2.95, .085] },
      air:    { hip: [-25, G - 31], sh: [22, G - 37], head: [39, G - 49], tilt: -.14, fold: 0, tail: [-2.55, .09] },
      sit:    { hip: [-11, G - 15], sh: [9, G - 41], head: [14, G - 61], tilt: 0, fold: 1, tail: [1.85, -.2] },
      groom:  { hip: [-11, G - 15], sh: [9, G - 39], head: [17, G - 50], tilt: .5, fold: 1, tail: [1.85, -.2] },
      lie:    { hip: [-20, G - 13], sh: [14, G - 14], head: [31, G - 19], tilt: .18, fold: 2, tail: [1.95, -.17] },
      bow:    { hip: [-20, G - 33], sh: [17, G - 15], head: [34, G - 24], tilt: .14, fold: 0, tail: [-1.85, .05] },
    };
    // where the paws go in a pose: near and far, hind and front
    function feetFor(name, p) {
      const [hx] = p.hip, [sx] = p.sh;
      if (name === "air") return { nh: [hx - 15, p.hip[1] + 19], fh: [hx - 19, p.hip[1] + 17], nf: [sx + 19, p.sh[1] + 14], ff: [sx + 14, p.sh[1] + 17] };
      if (name === "bow") return { nh: [hx + 1, G], fh: [hx - 4, G], nf: [sx + 22, G], ff: [sx + 16, G] };
      if (p.fold === 1) return { nh: [hx + 17, G], fh: [hx + 12, G], nf: [sx + 6, G], ff: [sx, G], groom: name === "groom" };
      if (p.fold === 2) return { nh: [hx + 13, G - 1], fh: [hx + 9, G - 1], nf: [sx + 22, G - 1], ff: [sx + 16, G - 1] };
      return { nh: [hx + 1, G], fh: [hx - 5, G], nf: [sx + 2, G], ff: [sx - 4, G] };
    }
    const copy = p => JSON.parse(JSON.stringify(p));
    const rig = { ...copy(POSES.lie), feet: feetFor("lie", POSES.lie) };
    const tailN = 11, tailL = 4.6, tailAng = Array(tailN).fill(0), tailVel = Array(tailN).fill(0);
    tailAng[0] = POSES.lie.tail[0]; for (let i = 1; i < tailN; i++) tailAng[i] = POSES.lie.tail[1];

    // the cat's state: sleep | purr | wake | sit | groom | chase | crouch | air | home | stretch
    const cat = { x: HOME, face: 1, mode: "sleep", t: 0, since: 0, vx: 0, y: 0, vy: 0, bats: 0, blink: 3, swipe: 0, gait: 0, purrPose: "lie", lastVx: 0 };
    let yarn = null, hearts = [], act = performance.now(), last = performance.now(), held = false;
    const touch = () => { act = performance.now(); };
    const setMode = m => { cat.mode = m; cat.since = 0; };
    const poseName = () => ({ sleep: "lie", purr: cat.purrPose, wake: "sit", sit: "sit", groom: "groom", chase: Math.abs(cat.vx) > 150 ? "run" : Math.abs(cat.vx) > 8 ? "walk" : "stand",
      crouch: "crouch", air: "air", home: Math.abs(cat.vx) > 8 ? "walk" : "stand", stretch: "bow" })[cat.mode] || "stand";

    function toss(x) {
      yarn = { x: Math.max(24, Math.min(W - 24, x)), y: 30, vx: (Math.random() - .5) * 140, vy: 0, spin: 0, trail: [] };
      cat.bats = 6; touch();
      if (cat.mode === "sleep") setMode("wake"); else if (cat.mode !== "purr" && cat.mode !== "air") setMode("chase");
    }
    const lying = () => cat.mode === "sleep" || (cat.mode === "purr" && cat.purrPose === "lie");
    const catBox = () => ({ x: cat.x - 48, y: GROUND - (lying() ? 46 : 84), w: 96, h: lying() ? 48 : 86 });
    function point(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }

    // ---- a soft purr, made on the spot: brown noise through a low filter, pulsing about 25 times a second, only while you pet ----
    let audio = null;
    function purrSound(on) {
      try {
        if (!audio && on) {
          const ctx = new AudioContext(), len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
          let v = 0; for (let i = 0; i < len; i++) { v = (v + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = v * 3.5; }
          const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
          const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 260;
          const pulse = ctx.createGain(); pulse.gain.value = .5;
          const lfo = ctx.createOscillator(); lfo.frequency.value = 25; const depth = ctx.createGain(); depth.gain.value = .5; lfo.connect(depth).connect(pulse.gain);
          const vol = ctx.createGain(); vol.gain.value = 0;
          src.connect(lp).connect(pulse).connect(vol).connect(ctx.destination); src.start(); lfo.start();
          audio = { ctx, vol };
        }
        if (audio) { const t = audio.ctx.currentTime; audio.vol.gain.cancelScheduledValues(t); audio.vol.gain.setTargetAtTime(on ? .22 : 0, t, on ? .15 : .08); if (on) audio.ctx.resume(); }
      } catch {}
    }

    document.getElementById("stage").addEventListener("pointerdown", e => {
      e.preventDefault(); const p = point(e), b = catBox(); touch();
      if (p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h && ["sleep", "sit", "groom", "purr"].includes(cat.mode)) {
        cat.purrPose = cat.mode === "sleep" || (cat.mode === "purr" && cat.purrPose === "lie") ? "lie" : "sit"; held = true; setMode("purr"); purrSound(true);
      } else toss(p.x);
    });
    const release = () => { if (!held) return; held = false; purrSound(false); touch(); setMode(cat.purrPose === "lie" && Math.abs(cat.x - HOME) < 4 ? "sleep" : "sit"); };
    addEventListener("pointerup", release); addEventListener("pointercancel", release);
    document.getElementById("yarn").addEventListener("click", () => toss(60 + Math.random() * (W - 120)));
    addEventListener("keydown", e => {
      if (e.key === " " && document.activeElement && document.activeElement.tagName === "BUTTON") return;
      if (e.key === " ") { e.preventDefault(); toss(60 + Math.random() * (W - 120)); }
      else if (e.key === "Enter" && document.activeElement === document.body) retry();
    });

    // back online: reload by itself once nobody has touched the page for a few seconds (after a stretch), else say so
    function backOnline() {
      if (!target || performance.now() < 2000) return; // an "online" event right at load is the browser settling, not the connection returning
      if (performance.now() - act < 3000 || held || ["chase", "crouch", "air"].includes(cat.mode)) { document.getElementById("back").hidden = false; return; }
      setMode("stretch"); setTimeout(retry, still ? 100 : 1400);
    }
    addEventListener("online", backOnline);
    addEventListener("offline", () => { document.getElementById("back").hidden = true; });

    // ---- behaviour and physics ----
    function step(dt) {
      cat.t += dt; cat.since += dt;
      cat.blink -= dt; if (cat.blink < -.13) cat.blink = 2.5 + Math.random() * 3.5;
      cat.swipe = Math.max(0, cat.swipe - dt);
      const now = performance.now();
      if (yarn) { // gravity, a bounce that loses energy, rolling friction, a spin that matches the roll; on the floor it unwinds a thread
        yarn.vy += 900 * dt; yarn.x += yarn.vx * dt; yarn.y += yarn.vy * dt;
        const ground = yarn.y >= G - R - .5;
        if (ground) { yarn.y = G - R; if (yarn.vy > 70) yarn.vy *= -.48; else yarn.vy = 0; yarn.vx *= Math.pow(.42, dt); yarn.spin += yarn.vx * dt / R; }
        else yarn.spin += yarn.vx * dt / R * .6;
        if (yarn.x < R + 4 || yarn.x > W - R - 4) { yarn.x = Math.max(R + 4, Math.min(W - R - 4, yarn.x)); yarn.vx *= -.6; }
        const tr = yarn.trail, lp = tr[tr.length - 1];
        if (ground && (!lp || Math.abs(lp[0] - yarn.x) > 5)) { tr.push([yarn.x, G - 1 - Math.random() * 2]); if (tr.length > 70) tr.shift(); }
      }
      // moving: accelerate toward a speed, ease off near the goal
      const goTo = (tx, top) => {
        const d = tx - cat.x, want = Math.sign(d) * Math.min(top, Math.abs(d) * 5);
        cat.vx += Math.max(-1100 * dt, Math.min(1100 * dt, want - cat.vx));
        if (Math.abs(d) < 2 && Math.abs(cat.vx) < 20) { cat.vx = 0; return true; }
        return false;
      };
      const m = cat.mode;
      if (m === "wake") { cat.vx = 0; if (yarn) cat.face = yarn.x > cat.x ? 1 : -1; if (cat.since > .95) setMode("chase"); }
      else if (m === "chase") {
        if (!yarn) { cat.vx *= .8; setMode("sit"); }
        else {
          const d = yarn.x - cat.x; if (Math.abs(d) > 6) cat.face = d > 0 ? 1 : -1;
          const resting = yarn.y >= G - R - 1 && Math.abs(yarn.vx) < 45;
          if (Math.abs(d) > 80 || !resting) goTo(yarn.x - cat.face * 74, 270);
          else { cat.vx = 0; setMode("crouch"); }
        }
      } else if (m === "crouch") { // eyes on the yarn, a little wiggle, then the leap
        cat.vx = 0; if (yarn) cat.face = yarn.x > cat.x ? 1 : -1;
        // the leap is aimed: up at 330, and forward just enough that the front paws come down on the yarn
        if (cat.since > .55) { const T = 2 * 330 / 1400, reach = yarn ? (yarn.x - cat.x) - cat.face * 30 : cat.face * 40; setMode("air"); cat.vy = -330; cat.vx = Math.max(-170, Math.min(170, reach / T)); }
      } else if (m === "air") {
        cat.vy += 1400 * dt; cat.y -= cat.vy * dt;
        if (cat.y <= 0 && cat.vy > 0) { // landed: swat the yarn if it's within reach
          cat.y = 0; cat.vy = 0; cat.vx *= .3;
          if (yarn && Math.abs(yarn.x - (cat.x + cat.face * 30)) < 34) { cat.swipe = .3; yarn.vx = cat.face * (190 + Math.random() * 150); yarn.vy = -230; touch(); }
          cat.bats--; // a miss counts too, so it always gives up in the end
          if (cat.bats > 0 && yarn) setMode("chase"); else { setMode("sit"); yarn = null; }
        }
      } else if (m === "sit") {
        cat.vx *= Math.pow(.02, dt); if (yarn) cat.face = yarn.x > cat.x ? 1 : -1;
        if (cat.since > 1.6 && !yarn && cat.since < 1.7 && Math.random() < .7) setMode("groom");
        if (now - act > IDLE) { setMode("home"); yarn = null; }
      } else if (m === "groom") { cat.vx = 0; if (cat.since > 2.4) { setMode("sit"); cat.since = 2; } }
      else if (m === "home") { if (Math.abs(HOME - cat.x) > 3) cat.face = HOME > cat.x ? 1 : -1; if (goTo(HOME, 105)) { cat.face = 1; setMode("sleep"); } }
      else if (m === "sleep" || m === "purr" || m === "stretch") cat.vx = 0;
      cat.x += cat.vx * dt;

      // the rig eases toward the pose (quicker for fast moves), then the gait moves the paws
      const name = poseName(), P0 = POSES[name], tgt = { ...P0, feet: feetFor(name, P0) }, k = 1 - Math.exp(-dt * (["air", "crouch", "run"].includes(name) ? 16 : 7));
      const mix = (a, b) => a + (b - a) * k, mix2 = (a, b) => [mix(a[0], b[0]), mix(a[1], b[1])];
      rig.hip = mix2(rig.hip, tgt.hip); rig.sh = mix2(rig.sh, tgt.sh); rig.head = mix2(rig.head, tgt.head); rig.tilt = mix(rig.tilt, tgt.tilt); rig.fold = mix(rig.fold, tgt.fold);
      for (const f of ["nh", "fh", "nf", "ff"]) rig.feet[f] = mix2(rig.feet[f], tgt.feet[f]);
      rig.groom = !!tgt.feet.groom; rig.name = name;
      const speed = Math.abs(cat.vx), stride = speed > 150 ? 34 : 22;
      cat.gait = (cat.gait + .6 * speed * dt / stride) % 1;
      // the tail: each joint springs toward the pose's curl, the base also swings against the body's acceleration (it lags), and
      // it sways a little on its own; it can't go through the floor (handled where it's drawn)
      const acc = (cat.vx - cat.lastVx) / Math.max(dt, .001); cat.lastVx = cat.vx;
      const sway = still ? 0 : Math.sin(cat.t * (name === "crouch" ? 9 : 2.2)) * (name === "crouch" ? .22 : name === "lie" ? .02 : .07);
      for (let i = 0; i < tailN; i++) {
        const want = i === 0 ? P0.tail[0] + sway * .4 : P0.tail[1] + sway * (i / tailN), kk = i === 0 ? 60 : 90;
        tailVel[i] += ((want - tailAng[i]) * kk - (i === 0 ? acc * .0009 * cat.face : 0) + (i === 0 ? cat.vy * .0006 : 0)) * dt;
        tailVel[i] *= Math.pow(.004, dt); tailAng[i] += tailVel[i] * dt;
      }
      for (const h of hearts) { h.y -= 26 * dt; h.x += Math.sin(h.t += dt * 3) * 6 * dt; h.a -= dt * .55; }
      hearts = hearts.filter(h => h.a > 0);
      if (m === "purr" && (cat.since % .55) < dt && !still) hearts.push({ x: cat.x + rig.head[0] * cat.face + (Math.random() - .5) * 18, y: rig.head[1] - 22, a: 1, t: Math.random() * 6 });
      if (m === "purr" && still && !hearts.length) hearts.push({ x: cat.x + rig.head[0] * cat.face, y: rig.head[1] - 22, a: 1, t: 0 });
    }

    // ---- drawing helpers ----
    const P = (d, fill, stroke, lw) => { const p = new Path2D(d); if (fill) { g.fillStyle = fill; g.fill(p); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(p); } return p; };
    const line = (x1, y1, x2, y2, col, lw) => { g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
    const ell = (x, y, rx, ry, col, rot = 0) => { g.fillStyle = col; g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, 7); g.fill(); };
    const vgrad = (y0, y1, a, b) => { const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, a); gr.addColorStop(1, b); return gr; };
    // two-part leg from root to paw; the joint bends backward (a cat's elbow and hock both point back)
    function limb(root, foot, a, b) {
      let dx = foot[0] - root[0], dy = foot[1] - root[1], d = Math.hypot(dx, dy);
      const max = a + b - .5; if (d > max) { foot = [root[0] + dx / d * max, root[1] + dy / d * max]; dx = foot[0] - root[0]; dy = foot[1] - root[1]; d = max; }
      d = Math.max(d, Math.abs(a - b) + .5);
      const ang = Math.atan2(dy, dx), off = Math.acos(Math.max(-1, Math.min(1, (a * a + d * d - b * b) / (2 * a * d))));
      const j = [root[0] + Math.cos(ang + off) * a, root[1] + Math.sin(ang + off) * a]; // + off puts the joint behind for a leg pointing down
      j[1] = Math.min(j[1], G - 2); // a knee or elbow never goes through the floor
      return { root, joint: j, foot };
    }
    // a body made of round parts: the union fills as one smooth shape, and the same path clips the stripes
    function capsule(path, A, rA, B, rB) {
      const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
      const pts = [[A[0] + nx * rA, A[1] + ny * rA], [B[0] + nx * rB, B[1] + ny * rB], [B[0] - nx * rB, B[1] - ny * rB], [A[0] - nx * rA, A[1] - ny * rA]];
      let area = 0; for (let i = 0; i < 4; i++) { const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % 4]; area += x1 * y2 - x2 * y1; }
      if (area < 0) pts.reverse(); // same winding as the circles, so the union has no holes
      path.moveTo(...pts[0]); for (const p of pts.slice(1)) path.lineTo(...p); path.closePath();
      path.moveTo(A[0] + rA, A[1]); path.arc(A[0], A[1], rA, 0, Math.PI * 2);
      path.moveTo(B[0] + rB, B[1]); path.arc(B[0], B[1], rB, 0, Math.PI * 2);
    }
    // the head, three-quarters, looking right. eyes: open | closed | happy | tight; mouth: yawn
    function head(hx, hy, r, o = {}) {
      const tw = o.twitch || 0;
      const ear = (bx, tilt, inner, dark) => {
        g.save(); g.translate(bx, hy - r * .55); g.rotate(tilt);
        P(`M${-r * .5} ${r * .25} Q${-r * .42} ${-r * .55} ${-r * .05} ${-r * 1.02} Q${r * .3} ${-r * .55} ${r * .48} ${r * .25}Z`, dark ? C.fur2 : C.fur);
        if (inner) P(`M${-r * .28} ${r * .12} Q${-r * .22} ${-r * .38} ${-r * .04} ${-r * .72} Q${r * .16} ${-r * .38} ${r * .26} ${r * .12}Z`, C.ear);
        g.restore();
      };
      ear(hx - r * .5, -.28 + tw * .25, false, true);           // the far ear
      g.fillStyle = vgrad(hy - r, hy + r, C["fur-hi"], C.fur);
      g.beginPath(); g.ellipse(hx, hy, r * 1.08, r * .96, 0, 0, 7); g.fill();
      // cheek fluff
      P(`M${hx - r * .9} ${hy + r * .25} l${-r * .32} ${r * .22} l${r * .3} ${r * .05} l${-r * .2} ${r * .2} l${r * .45} ${-r * .05}Z`, C.fur);
      ear(hx + r * .38, .3 - tw * .1, true, false);              // the near ear
      // forehead stripes
      g.globalAlpha = .6; for (const k of [-.25, .05, .35]) line(hx + r * k, hy - r * .92, hx + r * k + r * .04, hy - r * .58, C.fur2, 2.2); g.globalAlpha = 1;
      ell(hx + r * .5, hy + r * .42, r * .52, r * .36, C.cream);   // muzzle
      const eyes = [[hx - r * .12, hy - r * .1, .85], [hx + r * .52, hy - r * .12, 1]];
      const shut = o.eyes === "open" && !still && cat.blink < 0;
      for (const [ex, ey, s] of eyes) {
        g.strokeStyle = "#2a1d14"; g.lineWidth = 1.7; g.lineCap = "round";
        if (o.eyes === "closed" || shut) { g.beginPath(); g.arc(ex, ey - r * .1, r * .2 * s, .15 * Math.PI, .85 * Math.PI); g.stroke(); }
        else if (o.eyes === "happy") { g.beginPath(); g.arc(ex, ey + r * .12, r * .2 * s, 1.15 * Math.PI, 1.85 * Math.PI); g.stroke(); }
        else if (o.eyes === "tight") { line(ex - r * .16 * s, ey - r * .06, ex + r * .16 * s, ey + r * .04, "#2a1d14", 1.7); }
        else {
          const lk = o.look || 0;
          ell(ex, ey, r * .21 * s, r * .25 * s, "#2a1d14"); ell(ex, ey, r * .17 * s, r * .21 * s, C.iris);
          ell(ex + lk * r * .05, ey, r * .055 * s, r * .17 * s, "#16120e");
          ell(ex + lk * r * .05 + r * .06, ey - r * .08, r * .045, r * .045, "#fff");
        }
      }
      P(`M${hx + r * .82} ${hy + r * .18} l${r * .2} 0 l${-r * .1} ${r * .14}Z`, "#e9868a");      // nose
      if (o.mouth === "yawn") { ell(hx + r * .72, hy + r * .55, r * .17, r * .26, "#5a2a28"); ell(hx + r * .72, hy + r * .68, r * .11, r * .1, "#ef8f97"); }
      else { g.strokeStyle = "#3a2a20"; g.lineWidth = 1.1; g.beginPath(); g.moveTo(hx + r * .92, hy + r * .33); g.quadraticCurveTo(hx + r * .86, hy + r * .5, hx + r * .74, hy + r * .44); g.stroke(); }
      g.globalAlpha = .5; for (const k of [-1, 0, 1]) { line(hx + r * .95, hy + r * .38, hx + r * 1.8, hy + r * (.3 + k * .14), "#fff7ea", .8); line(hx + r * .2, hy + r * .42, hx - r * .62, hy + r * (.36 + k * .14), "#fff7ea", .8); } g.globalAlpha = 1;
    }
    function scene() {
      // wall, floor, and the alcove: a niche with a warm glow, a round night window, a cushion
      g.fillStyle = C.wall; g.fillRect(0, 0, W, H);
      g.fillStyle = C.floor; g.fillRect(0, GROUND, W, H - GROUND);
      g.fillStyle = vgrad(GROUND, H, "rgba(0,0,0,.10)", "rgba(0,0,0,0)"); g.fillRect(0, GROUND, W, H - GROUND);
      const arch = new Path2D(); arch.moveTo(HOME - 122, GROUND); arch.lineTo(HOME - 122, 146); arch.arc(HOME, 146, 122, Math.PI, 0); arch.lineTo(HOME + 122, GROUND); arch.closePath();
      g.fillStyle = vgrad(-12, GROUND, C["niche-top"], C["niche-bot"]); g.fill(arch);
      g.save(); g.clip(arch);
      const glow = g.createRadialGradient(HOME, GROUND - 20, 6, HOME, GROUND - 30, 190); glow.addColorStop(0, C.glow + "40"); glow.addColorStop(.5, C.glow + "14"); glow.addColorStop(1, C.glow + "00");
      g.fillStyle = glow; g.fillRect(0, 0, W, H);
      g.strokeStyle = C.edge; g.lineWidth = 14; g.stroke(arch);                              // the inner edge falls into shade
      g.restore();
      // the window: night sky, a crescent moon, stars that twinkle
      const wx = HOME, wy = 102, wr = 28;
      g.save(); g.beginPath(); g.arc(wx, wy, wr, 0, 7); g.clip();
      g.fillStyle = vgrad(wy - wr, wy + wr, C["sky-top"], C["sky-bot"]); g.fillRect(wx - wr, wy - wr, wr * 2, wr * 2);
      g.fillStyle = C.moon; g.beginPath(); g.arc(wx + 9, wy - 7, 10, 0, 7); g.fill();
      g.fillStyle = C["sky-top"]; g.beginPath(); g.arc(wx + 14, wy - 11, 9, 0, 7); g.fill();
      for (const [sx, sy, ph] of [[-14, -12, 0], [-6, 8, 2], [-18, 6, 4], [16, 14, 1]]) { g.globalAlpha = still ? .8 : .45 + .45 * Math.sin(cat.t * 1.6 + ph); g.fillStyle = C.moon; g.beginPath(); g.arc(wx + sx, wy + sy, 1.1, 0, 7); g.fill(); }
      g.globalAlpha = 1; g.restore();
      g.strokeStyle = C.wall; g.lineWidth = 5; g.beginPath(); g.arc(wx, wy, wr, 0, 7); g.stroke();
      g.globalAlpha = .9; line(wx - wr + 2, wy, wx + wr - 2, wy, C.wall, 3); line(wx, wy - wr + 2, wx, wy + wr - 2, C.wall, 3); g.globalAlpha = 1;
      // the cushion: a puffy pad with a highlight and a seam
      ell(HOME, GROUND - 1, 76, 6, "rgba(0,0,0,.25)");
      g.fillStyle = vgrad(GROUND - 16, GROUND, C["cushion-hi"], C.cushion); g.beginPath(); g.ellipse(HOME, GROUND - 7, 72, 10, 0, 0, 7); g.fill();
      g.globalAlpha = .35; g.strokeStyle = "#fff"; g.lineWidth = 1; g.setLineDash([3, 4]); g.beginPath(); g.ellipse(HOME, GROUND - 8, 60, 6.5, 0, Math.PI * 1.05, Math.PI * 1.95); g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
    }

    function drawYarn() {
      if (!yarn) return;
      const tr = yarn.trail;
      if (tr.length > 1) { g.strokeStyle = C.yarn; g.globalAlpha = .75; g.lineWidth = 1.4; g.beginPath(); g.moveTo(...tr[0]); for (let i = 1; i < tr.length; i++) { const [a, b] = tr[i - 1], [c, d] = tr[i]; g.quadraticCurveTo(a, b, (a + c) / 2, (b + d) / 2); } g.lineTo(yarn.x, yarn.y + 9); g.stroke(); g.globalAlpha = 1; }
      ell(yarn.x, GROUND + 1, 11 - Math.min(6, (GROUND - 11 - yarn.y) * .05), 3, "rgba(0,0,0,.22)");
      g.save(); g.translate(yarn.x, yarn.y); g.rotate(yarn.spin);
      const rg = g.createRadialGradient(-4, -4, 2, 0, 0, 12); rg.addColorStop(0, C["yarn-hi"]); rg.addColorStop(1, C.yarn);
      g.fillStyle = rg; g.beginPath(); g.arc(0, 0, 11, 0, 7); g.fill();
      g.strokeStyle = "rgba(255,255,255,.45)"; g.lineWidth = 1.1;
      for (const a of [0, .9, 1.8]) { g.save(); g.rotate(a); g.beginPath(); g.ellipse(0, 0, 10, 4.5, 0, 0, 7); g.stroke(); g.restore(); }
      g.restore();
    }

    // a tail along the chain: a filled shape that narrows from w0 to w1, a few darker rings and a dark tip
    function tailShape(pts, w0, w1) {
      const n = pts.length, L = [], Rr = [];
      pts.forEach((p, i) => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)], tx = b[0] - a[0], ty = b[1] - a[1], m = Math.hypot(tx, ty) || 1, w = (w0 + (w1 - w0) * i / (n - 1)) / 2; L.push([p[0] - ty / m * w, p[1] + tx / m * w]); Rr.push([p[0] + ty / m * w, p[1] - tx / m * w]); });
      const fill = (from, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(...L[from]); for (let i = from; i < n; i++) g.lineTo(...L[i]); g.arc(pts[n - 1][0], pts[n - 1][1], w1 / 2, 0, 7); for (let i = n - 1; i >= from; i--) g.lineTo(...Rr[i]); g.closePath(); g.fill(); };
      fill(0, C.fur);
      g.globalAlpha = .55; for (const i of [Math.round(n * .38), Math.round(n * .58)]) line(...L[i], ...Rr[i], C.fur2, 2.6); g.globalAlpha = 1;
      fill(Math.round(n * .76), C.fur2);
    }

    function drawCat() {
      const f = cat.face, x = cat.x, r = rig, name = r.name, fold = r.fold, lift = cat.y;
      const onCushion = Math.max(0, 1 - Math.max(0, Math.abs(x - HOME) - 40) / 30) * 7; // up on the cushion near home, easing off its edge
      const walking = name === "walk" || name === "run", run = name === "run";
      const bob = walking ? (run ? -Math.abs(Math.sin(Math.PI * 2 * cat.gait)) * 3 : Math.sin(Math.PI * 4 * cat.gait) * .8) : 0;
      const wig = name === "crouch" && !still ? Math.sin(cat.t * 20) * 1.8 : 0; // the bottom wiggle before a pounce
      const hip = [r.hip[0] + wig, r.hip[1] + bob], sh = [r.sh[0], r.sh[1] + bob * .6], hd = [r.head[0], r.head[1] + bob * .4];
      const sleepy = cat.mode === "sleep" || cat.mode === "purr";
      const br = still ? 0 : Math.sin(cat.t * (cat.mode === "purr" ? 9 : 2.1)) * (cat.mode === "purr" ? .045 : sleepy ? .035 : .012);
      const rh = (15 + 3 * Math.min(1, fold)) * (1 + br), rs = 13.5 * (1 + br * .7), rm = 12.6 * (1 + br);
      const mid = [(hip[0] + sh[0]) / 2, (hip[1] + sh[1]) / 2 + 2.5], neckB = [hd[0] - 7, hd[1] + 7];

      // the shadow stays on the floor and shrinks as the cat leaves it
      g.save(); g.translate(x, -onCushion); g.scale(f, 1);
      const span = Math.abs(sh[0] - hip[0]) + 34;
      g.fillStyle = `rgba(0,0,0,${Math.max(.08, .3 - lift * .004)})`; g.beginPath(); g.ellipse(mid[0], G + 1, span / 2 * Math.max(.5, 1 - lift * .006), 4.5, 0, 0, 7); g.fill();
      g.restore();

      g.save(); g.translate(x + (cat.mode === "purr" && !still ? Math.sin(cat.t * 90) * .35 : 0), -onCushion - lift); g.scale(f, 1); g.lineCap = "round"; g.lineJoin = "round";
      // paws: the pose's places, moved by the gait (planted, then lifted and carried forward)
      const off = run ? { nh: 0, fh: .08, nf: .5, ff: .58 } : { nh: 0, nf: .25, fh: .5, ff: .75 }, stride = run ? 34 : 22, liftH = run ? 10 : 6;
      const feet = {};
      for (const k of ["nh", "fh", "nf", "ff"]) {
        let [fx, fy] = r.feet[k];
        if (walking) { const p = (cat.gait + off[k]) % 1; if (p < .6) fx += stride * (.5 - p / .6); else { const q = (p - .6) / .4; fx += stride * (-.5 + q); fy -= Math.sin(Math.PI * q) * liftH; } }
        feet[k] = [fx, fy];
      }
      if (r.groom) feet.nf = [hd[0] + 3, hd[1] + 13 + (still ? 0 : Math.sin(cat.t * 9) * 2)];   // a paw up to the mouth
      if (cat.swipe > 0) feet.nf = [sh[0] + 26, sh[1] + 2 - Math.sin(cat.swipe / .3 * Math.PI) * 8]; // the swat
      const frontRoot = [sh[0] + 2, sh[1] + 5], hindRoot = [hip[0] + 1, hip[1] + 4];
      const lying = fold > 1.5;
      const leg = (root, foot, a, b, col, w1, w2, paw) => {
        const L = lying ? { root, joint: [(root[0] + foot[0]) / 2, Math.min(G - 3, (root[1] + foot[1]) / 2)], foot } : limb(root, foot, a, b);
        line(...L.root, ...L.joint, col, w1); line(...L.joint, ...L.foot, col, w2);
        ell(L.foot[0] + 2, L.foot[1] - 1.6, 5.8, 3.2, paw);
      };
      const folded = fold > .5;
      // the far side, in shade
      if (!folded) leg([hindRoot[0] - 4, hindRoot[1]], feet.fh, 16, 16.5, C.fur2, 8.5, 6, C.fur2);
      else ell(feet.fh[0] + 2, feet.fh[1] - 2, 6, 3.4, C.fur2);
      leg([frontRoot[0] - 4, frontRoot[1]], feet.ff, 14.5, 15.5, C.fur2, 7.5, 6, C.fur2);
      // the tail: a chain from the rump; it lies on the floor rather than going through it
      const tpts = [[hip[0] - rh * .82, hip[1] - 3]]; let ang = 0;
      for (let i = 0; i < tailN; i++) { ang = i === 0 ? tailAng[0] : ang + tailAng[i]; const [px, py] = tpts[tpts.length - 1]; tpts.push([px + Math.cos(ang) * tailL, Math.min(G - 3.5, py + Math.sin(ang) * tailL)]); }
      if (!folded) tailShape(tpts, 8.5, 5.5);
      // the body: rump, belly, chest and neck as one shape, shaded from the back down
      const body = new Path2D();
      capsule(body, hip, rh, mid, rm); capsule(body, mid, rm, sh, rs); capsule(body, sh, rs * .82, neckB, 8.5);
      const top = Math.min(hip[1] - rh, sh[1] - rs, neckB[1] - 9);
      g.fillStyle = vgrad(top, G, C["fur-hi"], C.fur); g.fill(body);
      g.save(); g.clip(body);
      ell(mid[0] + 4, mid[1] + rm * .85, 20, 6.5, C.cream);                                       // belly
      ell(sh[0] + rs * .75, sh[1] + 4, 7.5, 11, C.cream, -.2);                                    // chest
      g.globalAlpha = .6;
      for (const t of [.08, .27, .46, .65]) { const px = hip[0] + (sh[0] - hip[0]) * t, py = hip[1] + (sh[1] - hip[1]) * t; line(px - 1, py - 17, px + 2, py - 4, C.fur2, 3.3); }
      g.globalAlpha = .3; g.strokeStyle = C.fur2; g.lineWidth = 1.4; g.beginPath(); g.arc(hip[0] + 2, hip[1] + 2, rh * .78, -2.3, folded ? .9 : .4); g.stroke(); // the line of the thigh
      g.globalAlpha = 1; g.restore();
      if (folded) tailShape(tpts, 8.5, 5.5);                                                     // sitting or lying, it wraps round in front
      // the near side
      if (!folded) { ell(hindRoot[0] + 1, hindRoot[1] + 1, 10.5, 12.5, C.fur, -.25); leg(hindRoot, feet.nh, 16, 16.5, C.fur, 8.5, 6.2, C.fur); }
      else ell(feet.nh[0] + 2, feet.nh[1] - 2, 6.4, 3.6, C.cream);
      leg(frontRoot, feet.nf, 14.5, 15.5, C.fur, 7.8, 6.4, C.cream);
      // the head
      let eyes = "open", mouth = null;
      if (cat.mode === "sleep") eyes = "closed";
      else if (cat.mode === "purr") eyes = "happy";
      else if (cat.mode === "wake") { if (cat.since < .7) { eyes = "tight"; mouth = cat.since > .15 ? "yawn" : null; } }
      else if (cat.mode === "groom") eyes = "closed";
      else if (cat.mode === "stretch") eyes = "tight";
      let look = 1;
      if (yarn) { const dx = (yarn.x - (x + hd[0] * f)) * f; look = Math.max(-1, Math.min(1, dx / 70)); }
      const nod = r.groom && !still ? Math.sin(cat.t * 9) * .07 : 0;
      g.save(); g.translate(hd[0], hd[1]); g.rotate(r.tilt + nod); head(0, 0, 13.5, { eyes, look, mouth, twitch: cat.mode === "sleep" && !still && (cat.t % 4.3) < .18 ? 1 : 0 }); g.restore();
      g.restore();
    }

    function draw() {
      g.setTransform(SC, 0, 0, SC, 0, 0);
      scene();
      if (cat.mode === "sleep" && !still) { // z's drifting up from the sleeper
        g.fillStyle = C.muted; g.font = "600 15px ui-monospace, Menlo, Consolas, monospace";
        for (let i = 0; i < 3; i++) { const k = ((cat.t * .32 + i / 3) % 1); g.globalAlpha = Math.sin(k * Math.PI) * .75; g.fillText("z", cat.x + (48 + k * 22 + i * 4) * cat.face, GROUND - 44 - k * 40); }
        g.globalAlpha = 1;
      }
      drawYarn(); // behind the cat, so a pounce lands on it
      drawCat();
      for (const h of hearts) { g.globalAlpha = Math.max(0, h.a); g.fillStyle = C.yarn; g.font = "15px system-ui, sans-serif"; g.fillText("♥", h.x, h.y); }
      g.globalAlpha = 1;
    }

    function frame(now) {
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      step(dt); draw(); requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    document.getElementById("stage").focus({ preventScroll: true });
  </script>
</body>
</html>
