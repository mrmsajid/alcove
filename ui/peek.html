<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peek</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { display: block; height: 100%; padding: 0; margin: 0; background: rgba(0, 0, 0, .45) !important; }
    body { animation: fade-in .18s ease; }
    .bar { position: absolute; top: 12px; left: 0; right: 0; display: flex; justify-content: center; }
    .pill {
      display: flex; align-items: center; gap: 8px; max-width: 72%; padding: 4px 4px 4px 14px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--border); box-shadow: 0 10px 30px #0006;
      animation: pop .18s cubic-bezier(.2, .8, .2, 1);
    }
    #what { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .pill button { padding: 5px 12px; border-radius: 999px; flex: none; }
    #open { background: var(--accent); color: #fff; font-weight: 600; }
    #open:hover { background: var(--accent); filter: brightness(1.08); }
    kbd { font: inherit; opacity: .7; margin-left: 4px; }
  </style>
</head>
<body>
  <div class="bar">
    <div class="pill">
      <span id="what"></span>
      <button id="open" title="Keep this page as a tab">Open as tab<kbd>⌘↵</kbd></button>
      <button id="close" title="Close (Esc)">✕</button>
    </div>
  </div>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    if (!/Mac/.test(navigator.userAgent)) document.querySelector("kbd").textContent = "Ctrl+↵";
    listen("peek-info", ({ payload }) => { document.getElementById("what").textContent = payload.title || payload.url; });
    document.getElementById("open").addEventListener("click", e => { e.stopPropagation(); invoke("peek_open_tab"); });
    document.getElementById("close").addEventListener("click", e => { e.stopPropagation(); invoke("peek_close"); });
    // Clicking the dimmed area around the preview closes it.
    document.addEventListener("click", e => { if (!e.target.closest(".pill")) invoke("peek_close"); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") invoke("peek_close"); });
  </script>
</body>
</html>
