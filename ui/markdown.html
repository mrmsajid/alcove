<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown</title>
  <!-- A note is untrusted text: if anything in it ever got past the renderer it still could not call out (no fetch,
       XHR, sockets, frames, plugins or form posts). Images may come from https: and data: only. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https: data:; font-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <style>
    :root { color-scheme: dark light; --bg: #1d1d20; --surface: #26262a; --text: #ededf0; --muted: #8e8e97; --line: #ffffff17; --accent: #76767f; --code: #ffffff0f; --link: #8ab4ff; --hover: #ffffff10; --tag: #ffffff14; }
    @media (prefers-color-scheme: light) { :root { --bg: #fbfbfc; --surface: #f1f1f4; --text: #1c1c1f; --muted: #6e6e78; --line: #0000001a; --code: #0000000a; --link: #1a5fd0; --hover: #0000000a; --tag: #0000000d; } }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; } /* panels set their own display, which would otherwise win over hidden */
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      --doc-size: 15px; --doc-font: -apple-system, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; --ed-size: 13.5px; }
    button, select { font: inherit; color: inherit; background: transparent; border: 0; border-radius: 8px; padding: 5px 11px; cursor: pointer; }
    button:hover, select:hover { background: var(--hover); }
    button:disabled { opacity: .4; cursor: default; }
    svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    header { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex: none; } /* wraps rather than pushing buttons off a narrow window */
    header .name { font-weight: 600; margin: 0 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header .name i { color: var(--muted); font-style: normal; font-weight: 400; }
    header .sp { flex: 1; }
    .seg { display: flex; padding: 2px; background: var(--surface); border-radius: 9px; }
    .seg button { padding: 3px 12px; font-size: 12.5px; color: var(--muted); }
    .seg button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px #0003; }
    .primary { background: var(--accent); color: #fff; }
    .primary:hover { background: var(--accent); filter: brightness(1.1); }

    /* formatting toolbar */
    #fmt { display: flex; align-items: center; gap: 2px; padding: 5px 12px; border-bottom: 1px solid var(--line); flex: none; overflow-x: auto; scrollbar-width: none; }
    #fmt button { flex: none; min-width: 30px; height: 28px; padding: 0 7px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
    #fmt button:hover, #fmt button.on { color: var(--text); }
    #fmt button.on { background: var(--hover); }
    #fmt .g { font-weight: 700; font-size: 13.5px; } #fmt .gi { font-style: italic; font-weight: 600; font-family: Georgia, serif; } #fmt .gs { text-decoration: line-through; font-weight: 600; }
    #fmt .gm { font: 12px ui-monospace, Menlo, Consolas, monospace; } #fmt .gt { font-size: 12.5px; }
    #fmt .bar { flex: none; width: 1px; height: 18px; margin: 0 5px; background: var(--line); }
    #fmt select { height: 28px; padding: 0 8px; margin-right: 2px; color: var(--text); background: var(--surface); }
    #tagbar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 6px 14px; border-bottom: 1px solid var(--line); flex: none; font-size: 12.5px; }
    #tagbar:empty { display: none; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 4px 1px 9px; border-radius: 999px; background: var(--tag); color: var(--text); }
    .chip.soft { color: var(--muted); padding-right: 9px; }
    .chip button { padding: 0 5px; border-radius: 50%; color: var(--muted); line-height: 1.3; }
    .addtag { color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 1px 10px; }

    main { flex: 1; display: flex; min-height: 0; position: relative; }
    /* right side panel: files of an opened folder, and the outline of this document */
    #edge { flex: none; width: 14px; padding: 0; border-radius: 0; color: var(--muted); border-left: 1px solid var(--line); font-size: 13px; line-height: 1; }
    #edge:hover { background: var(--hover); color: var(--text); }
    #side { width: 270px; flex: none; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); }
    #sidetabs { display: flex; align-items: center; gap: 2px; padding: 8px 8px 6px; flex: none; }
    #sidetabs button[data-t] { padding: 3px 10px; font-size: 12.5px; color: var(--muted); }
    #sidetabs button[data-t].on { background: var(--surface); color: var(--text); }
    #files, #outline, #search { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #files[hidden], #outline[hidden], #search[hidden] { display: none; }
    /* search: text or #tags across the loaded folders */
    .shead { padding: 2px 10px 8px; display: flex; flex-direction: column; gap: 7px; flex: none; }
    #sq { width: 100%; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; font: inherit; outline: none; user-select: text; }
    #sq:focus { border-color: var(--accent); }
    .sopts { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
    .sopts label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
    .sopts input { accent-color: var(--accent); margin: 0; }
    .sopts select { margin-left: auto; max-width: 120px; padding: 2px 6px; font-size: 12px; background: var(--surface); }
    #sstat { padding: 0 12px 6px; font-size: 12px; color: var(--muted); flex: none; min-height: 1.4em; }
    #sresults { flex: 1; overflow: auto; padding: 0 6px 12px; font-size: 13px; }
    .sfile { margin-top: 6px; }
    #sresults .sfile > button { display: flex; align-items: baseline; gap: 6px; width: 100%; text-align: left; padding: 3px 8px; font-weight: 600; }
    .sfile .rel { color: var(--muted); font-weight: 400; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .sfile .n { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 11.5px; flex: none; }
    #sresults .smatch { display: flex; gap: 8px; width: 100%; text-align: left; padding: 2px 8px 2px 12px; color: var(--muted); font-size: 12.5px; }
    #sresults .smatch:hover { color: var(--text); }
    .smatch .ln { flex: none; width: 30px; text-align: right; opacity: .65; font-variant-numeric: tabular-nums; }
    .smatch .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sfile .stags { display: flex; flex-wrap: wrap; gap: 4px; padding: 1px 10px 2px; }
    .sfile .stags span { padding: 0 8px; border-radius: 999px; background: var(--tag); font-size: 11.5px; }
    mark { background: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--text); border-radius: 3px; padding: 0 1px; }
    .tagcloud { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 10px 10px; }
    #sresults .tagcloud button { width: auto; padding: 2px 10px; border-radius: 999px; background: var(--tag); font-size: 12.5px; display: inline-flex; }
    .tagcloud button span { color: var(--muted); margin-left: 5px; }
    .shint { padding: 4px 12px 8px; color: var(--muted); font-size: 12px; }
    .filehead { display: flex; align-items: center; gap: 1px; padding: 2px 8px 6px; flex: none; }
    .filehead .fname { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 4px; }
    .filehead button { padding: 0; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
    .filehead button:hover { color: var(--text); }
    .filehead button svg { width: 16px; height: 16px; }
    #tree, #outlinelist { flex: 1; overflow: auto; padding: 0 6px 12px; font-size: 13px; }
    #tree button, #outlinelist button { display: flex; align-items: center; gap: 5px; width: 100%; text-align: left; padding: 3px 8px; border-radius: 6px; overflow: hidden; white-space: nowrap; color: var(--text); }
    #tree button span, #outlinelist button span { overflow: hidden; text-overflow: ellipsis; }
    #tree button.on { background: var(--surface); font-weight: 600; }
    #tree .chev { flex: none; width: 10px; color: var(--muted); font-size: 10px; }
    #tree .dim { color: var(--muted); }
    #tree .pick { outline: 1px dashed var(--line); }
    #outlinelist button { color: var(--muted); }
    #outlinelist button:hover { color: var(--text); }
    .side-empty { padding: 10px 12px; color: var(--muted); font-size: 12.5px; }
    .rootrow { display: flex; align-items: center; margin-top: 4px; }
    #tree .rootrow .root { flex: 1; font-weight: 600; }
    #tree .rootrow .unload { flex: none; width: 26px; justify-content: center; padding: 3px 0; color: var(--muted); opacity: .7; }
    #tree .rootrow .unload svg { width: 15px; height: 15px; }
    .rootrow:hover .unload { opacity: 1; }
    #tree .rootrow .unload:hover { color: var(--text); background: var(--hover); }
    .side-empty .recents { margin-top: 14px; display: flex; flex-direction: column; gap: 2px; text-align: left; }
    .side-empty .recents h5 { margin: 0 0 2px 8px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
    .side-empty .recents button { border: 0; margin: 0; padding: 3px 8px; color: var(--text); display: block; width: 100%; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .side-empty button { margin-top: 10px; border: 1px solid var(--line); }
    #edit { flex: 1; min-width: 0; border: 0; outline: 0; resize: none; padding: 20px 24px; background: var(--bg); color: var(--text);
      font: var(--ed-size)/1.65 ui-monospace, "SF Mono", Menlo, Consolas, monospace; tab-size: 2; }
    #view { flex: 1; min-width: 0; overflow: auto; padding: 20px 28px 60px; }
    /* visual editor: a page you type into directly */
    #visbox { flex: 1; min-width: 0; overflow: auto; padding: 20px 28px 60px; }
    #vis { max-width: 760px; margin: 0 auto; min-height: calc(100% - 4px); outline: none; }
    #vis.is-empty > p:first-child::before { content: "Start writing. Type # for a heading, - for a list, [] for a to-do, or use the toolbar."; color: var(--muted); pointer-events: none; }
    #vis pre { white-space: pre-wrap; }
    #vis table { display: table; width: 100%; }
    #vis td, #vis th { min-width: 60px; }
    #vis li.task { list-style: none; margin-left: -1.3em; }
    #vis li.task input { margin-right: .55em; }
    #vis::selection, #vis *::selection { background: color-mix(in srgb, var(--accent) 40%, transparent); }
    body.visual #edit, body.visual #view, body.code #view, body.code #visbox, body.split #visbox { display: none; }
    body.split #edit { border-right: 1px solid var(--line); }
    /* graph view: notes as glowing nodes, links as lines */
    #graphbox { flex: 1; min-width: 0; position: relative; display: none; overflow: hidden;
      background: radial-gradient(ellipse at center, color-mix(in srgb, var(--accent) 9%, var(--bg)) 0%, var(--bg) 75%); }
    body.graph #graphbox { display: block; }
    body.graph #edit, body.graph #view, body.graph #visbox, body.graph #fmt, body.graph #tagbar { display: none; }
    #gcanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #gbar { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; pointer-events: none; z-index: 2; }
    #gbar > * { pointer-events: auto; }
    .gpanel { display: flex; align-items: center; gap: 4px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 11px; background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(10px); font-size: 12.5px; }
    .gpanel input[type=search] { width: 170px; background: transparent; border: 0; outline: 0; color: var(--text); font: inherit; padding: 3px 6px; user-select: text; }
    .gpanel label { display: inline-flex; align-items: center; gap: 5px; padding: 2px 6px; color: var(--muted); cursor: pointer; }
    .gpanel label:hover { color: var(--text); }
    .gpanel input[type=checkbox] { accent-color: var(--accent); margin: 0; }
    .gpanel button { padding: 3px 9px; font-size: 12.5px; color: var(--muted); }
    .gpanel button.on { background: var(--bg); color: var(--text); }
    .gpanel button:hover { color: var(--text); }
    #gstat { color: var(--muted); font-size: 12px; padding: 0 4px; }
    #gtip { position: absolute; z-index: 3; pointer-events: none; padding: 6px 10px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 6px 20px #0004; font-size: 12.5px; max-width: 280px; }
    #gtip b { display: block; } #gtip span { color: var(--muted); }
    #gempty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: var(--muted); gap: 12px; }
    #gempty button { justify-self: center; border: 1px solid var(--line); }
    #splitbtn { color: var(--muted); font-size: 12.5px; }
    #splitbtn.on { color: var(--text); background: var(--hover); }
    .sugs { display: flex; flex-wrap: wrap; gap: 5px; }
    .sugs button { padding: 1px 9px; font-size: 12px; border-radius: 999px; background: var(--tag); color: var(--text); }
    .sugs h5 { flex: 0 0 100%; margin: 0; font-size: 11px; font-weight: 600; color: var(--muted); }
    footer { display: flex; gap: 14px; padding: 5px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; flex: none; }
    #msg { margin-left: auto; }

    .doc { max-width: 760px; margin: 0 auto; font-family: var(--doc-font); font-size: var(--doc-size); line-height: 1.65; }
    .doc > :first-child { margin-top: 0; }
    .doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 { line-height: 1.25; margin: 1.5em 0 .5em; }
    .doc h1 { font-size: 1.9em; padding-bottom: .3em; border-bottom: 1px solid var(--line); }
    .doc h2 { font-size: 1.5em; padding-bottom: .25em; border-bottom: 1px solid var(--line); }
    .doc h3 { font-size: 1.2em; } .doc h4 { font-size: 1.05em; } .doc h5, .doc h6 { font-size: .95em; color: var(--muted); }
    .doc p, .doc ul, .doc ol, .doc blockquote, .doc pre, .doc table { margin: 0 0 1em; }
    .doc a { color: var(--link); }
    .doc code { font: .9em ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--code); padding: .15em .4em; border-radius: 5px; }
    .doc pre { background: var(--code); padding: 12px 14px; border-radius: 10px; overflow: auto; }
    .doc pre code { background: none; padding: 0; font-size: .88em; }
    .doc blockquote { border-left: 3px solid var(--line); padding: 0 1em; color: var(--muted); }
    .doc blockquote > :last-child { margin-bottom: 0; }
    .doc hr { border: 0; border-top: 1px solid var(--line); margin: 1.6em 0; }
    .doc img { max-width: 100%; border-radius: 6px; }
    .doc ul, .doc ol { padding-left: 1.6em; }
    .doc li.task { list-style: none; margin-left: -1.3em; }
    .doc li.task input { margin-right: .5em; accent-color: var(--accent); cursor: pointer; }
    .doc li.task input:disabled { cursor: default; }
    .doc li.done { color: var(--muted); text-decoration: line-through; }
    .doc table { border-collapse: collapse; display: block; overflow: auto; }
    .doc th, .doc td { border: 1px solid var(--line); padding: 6px 12px; }
    .doc th { background: var(--code); }
    .doc .tag { background: var(--tag); padding: .05em .55em; border-radius: 999px; font-size: .88em; white-space: nowrap; }
    .doc .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.2em; }
    .empty { margin: 14vh auto 0; text-align: center; color: var(--muted); max-width: 360px; }
    .empty h2 { color: var(--text); font-weight: 600; margin: 0 0 6px; }
    .empty p { margin: 0 0 18px; }

    .pop, .menu { position: fixed; z-index: 10; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px #0005; padding: 10px; }
    .pop { display: flex; flex-direction: column; gap: 8px; min-width: 260px; }
    .pop h4 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; }
    .pop label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
    .pop input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font: inherit; outline: none; user-select: text; }
    .pop input:focus { border-color: var(--accent); }
    .pop .row { display: flex; gap: 6px; justify-content: flex-end; }
    .menu { padding: 5px; min-width: 200px; }
    .menu button { display: flex; width: 100%; justify-content: space-between; gap: 18px; text-align: left; padding: 6px 10px; }
    .menu .sep { height: 1px; margin: 4px 6px; background: var(--line); }
    .menu .head { padding: 5px 10px 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .menu button.on::after { content: "✓"; color: var(--muted); }
    .menu kbd { color: var(--muted); font: 11px -apple-system, system-ui, sans-serif; }
    #drop { display: none; position: fixed; inset: 8px; border: 2px dashed var(--accent); border-radius: 14px; background: #0000001a; place-items: center; font-size: 16px; pointer-events: none; }
    body.dragging #drop { display: grid; }
  </style>
</head>
<body class="visual">
  <header>
    <button id="open" title="Open a Markdown file (⌘O)">Open…</button>
    <button id="openfolder" title="Mount a folder: browse, edit and search all its notes. You can mount several.">Mount folder…</button>
    <button id="new" title="New document">New</button>
    <span class="name" id="name"></span>
    <span class="sp"></span>
    <div class="seg" id="modes">
      <button data-mode="visual" title="Edit the page itself: headings and tags are written as Markdown for you">Visual</button><button data-mode="code" title="Edit the Markdown text">Code</button><button data-mode="graph" title="See how the notes in the open folder link to each other">Graph</button>
    </div>
    <button id="splitbtn" title="Show a live preview next to the code" hidden>Preview</button>
    <button id="sidebtn" title="Files and outline"></button>
    <button id="save" class="primary" title="Save (⌘S)">Save</button>
    <button id="saveas" title="Save a copy">Save as…</button>
  </header>
  <div id="fmt"></div>
  <div id="tagbar"></div>
  <main>
    <div id="visbox"><div id="vis" class="doc" contenteditable="true" spellcheck="true"></div></div>
    <div id="graphbox">
      <canvas id="gcanvas"></canvas>
      <div id="gbar">
        <div class="gpanel" id="gscope"><button data-s="all" class="on">All notes</button><button data-s="local" title="Only the open note and the notes around it">This note</button>
          <span id="gdepth" hidden><button id="gdm" title="Fewer steps away">−</button><span id="gd">1</span><button id="gdp" title="More steps away">+</button></span></div>
        <div class="gpanel" id="gfolderbox" hidden><select id="gfolder" title="Which loaded folder to show"></select></div>
        <div class="gpanel"><input id="gsearch" type="search" placeholder="Find a note or #tag" spellcheck="false"></div>
        <div class="gpanel"><label><input type="checkbox" id="g-tags"> Tags</label><label><input type="checkbox" id="g-ghost"> Unresolved links</label><label><input type="checkbox" id="g-orph" checked> Orphans</label></div>
        <div class="gpanel"><button id="gfit" title="Fit everything on screen">Fit</button><button id="grefresh" title="Read the folder again">Refresh</button><span id="gstat"></span></div>
      </div>
      <div id="gempty" hidden><div><h2 style="margin:0 0 6px;color:var(--text);font-weight:600">No folder mounted</h2><p style="margin:0"></p></div><button id="gopen">Mount folder…</button></div>
      <div id="gtip" hidden></div>
    </div>
    <textarea id="edit" spellcheck="true" placeholder="Start writing in Markdown…"></textarea>
    <div id="view"><div class="doc" id="doc"></div></div>
    <button id="edge" title="Show or hide the files and outline panel">‹</button>
    <aside id="side" hidden>
      <div id="sidetabs">
        <button data-t="files">Files</button><button data-t="search" title="Find text or #tags in your folders (⌘⇧F)">Search</button><button data-t="outline">Outline</button>
      </div>
      <div id="files">
        <div class="filehead">
          <span class="fname" id="fname"></span>
          <button id="f-note" title="New note"></button>
          <button id="f-dir" title="New folder"></button>
          <button id="f-refresh" title="Refresh"></button>
          <button id="f-recent" title="Mount a recent folder"></button>
          <button id="f-open" title="Mount another folder…"></button>
        </div>
        <div id="tree"></div>
      </div>
      <div id="search" hidden>
        <div class="shead">
          <input id="sq" type="search" placeholder="Search text, or #tag" spellcheck="false" autocomplete="off">
          <div class="sopts">
            <label title="Match upper and lower case"><input type="checkbox" id="s-case"> Aa</label>
            <label title="Treat the search as a regular expression"><input type="checkbox" id="s-re"> .*</label>
            <select id="s-scope" title="Where to look" hidden></select>
          </div>
        </div>
        <div id="sstat"></div>
        <div id="sresults"></div>
      </div>
      <div id="outline" hidden><div id="outlinelist"></div></div>
    </aside>
  </main>
  <footer><span id="count"></span><span id="path"></span><span id="msg"></span></footer>
  <div id="drop">Drop a Markdown file to open it</div>

  <script>
    // ---- Markdown → HTML. Everything is escaped before it's formatted, so a document can't inject markup,
    // and only http(s) and mailto links and http(s) images are kept. ----
    const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const safeLink = u => /^(https?:\/\/|mailto:|#)/i.test(u);
    const safeImg = u => /^https?:\/\//i.test(u);

    function inline(src) {
      const codes = [], lits = [], tags = [];
      const lit = c => { lits.push(c); return `\u0001${lits.length - 1}\u0001`; };
      // A tag built here is set aside as a placeholder, so the passes after it (autolinks, emphasis, #tags) only ever see
      // text and can never rewrite the inside of a tag's attributes. (A bare URL in an image's alt text used to turn into
      // a link inside the attribute, which let a document add an onerror attribute.) The placeholders use control
      // characters, so they are removed from the source first.
      const tag = html => { tags.push(html); return `\u0002${tags.length - 1}\u0002`; };
      let t = src.replace(/[\u0000-\u0002]/g, "").replace(/\\`/g, () => lit("`")); // an escaped backtick doesn't start a code span
      t = t.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
      t = t.replace(/\\([\\*_~#>+\-.!|\[\]()<])/g, (_, c) => lit(c)); // \* \# … show the character itself
      t = esc(t);
      t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (m, alt, url) => safeImg(url) ? tag(`<img src="${url}" alt="${alt}">`) : alt);
      const open = url => tag(`<a href="${url}" target="_blank" rel="noopener noreferrer">`);
      // URLs never contain a placeholder (\u0002): one would end up inside an href and carry its quotes with it.
      t = t.replace(/\[([^\]]+)\]\(([^)\s\u0002]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (m, text, url) => safeLink(url) ? `${open(url)}${text}</a>` : text);
      t = t.replace(/&lt;(https?:\/\/[^\s&\u0002]+)&gt;/g, (m, url) => `${open(url)}${url}</a>`);
      t = t.replace(/(^|[\s(])(https?:\/\/[^\s<\u0002]*[^\s<\u0002.,;:!?)\]])/g, (m, pre, url) => `${pre}${open(url)}${url}</a>`);
      t = t.replace(/\*\*(?=\S)(.+?)(?<=\S)\*\*/g, "<strong>$1</strong>").replace(/(^|\W)__(?=\S)(.+?)(?<=\S)__(?!\w)/g, "$1<strong>$2</strong>");
      t = t.replace(/(^|[^*])\*(?=[^\s*])(.+?)(?<=[^\s*])\*(?!\*)/g, "$1<em>$2</em>").replace(/(^|\W)_(?=[^\s_])(.+?)(?<=[^\s_])_(?!\w)/g, "$1<em>$2</em>");
      t = t.replace(/~~(?=\S)(.+?)(?<=\S)~~/g, "<del>$1</del>");
      // #tags in running text (never inside a tag's own attributes)
      t = t.split(/(<[^>]*>)/).map(seg => (seg.startsWith("<") ? seg : seg.replace(/(^|[\s(])#([A-Za-z][\w/-]{0,39})(?![\w/-])/g, '$1<span class="tag">#$2</span>'))).join("");
      t = t.replace(/ {2,}\n/g, "<br>");
      return t.replace(/\u0002(\d+)\u0002/g, (_, i) => tags[i]).replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`).replace(/\u0001(\d+)\u0001/g, (_, i) => esc(lits[i]));
    }

    const LIST_ITEM = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
    const HR = /^\s*([-*_])(\s*\1){2,}\s*$/;
    const TABLE_SEP = l => l.includes("-") && l.includes("|") && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(l);

    function listHtml(items) {
      let pos = 0;
      const build = indent => {
        const start = pos;
        const tag = items[pos].ordered ? "ol" : "ul";
        let html = `<${tag}>`;
        while (pos < items.length && items[pos].indent >= indent) {
          const it = items[pos];
          if (it.indent === indent && it.ordered !== items[start].ordered) break; // bullets then numbers: a new list
          if (it.indent > indent) { html = html.replace(/<\/li>$/, "") + build(it.indent) + "</li>"; continue; }
          pos++;
          const task = it.text.match(/^\[([ xX])\]\s+(.*)$/);
          if (task) {
            const checked = task[1] !== " ";
            // clickable when the line is known (top-level lists); clicking edits the source, see the #doc handler
            const box = it.line >= 0 ? `<input type="checkbox" data-line="${it.line}"${checked ? " checked" : ""}>` : `<input type="checkbox" disabled${checked ? " checked" : ""}>`;
            html += `<li class="task${checked ? " done" : ""}">${box}${inline(task[2])}</li>`;
          } else html += `<li>${inline(it.text)}</li>`;
        }
        return html + `</${tag}>`;
      };
      let out = "";
      while (pos < items.length) out += build(items[pos].indent);
      return out;
    }

    function render(md, top = true) {
      const lines = md.replace(/\r\n?/g, "\n").split("\n");
      const out = [];
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        let m = line.match(/^\s*(```|~~~)\s*([\w+-]*)/);
        if (m) {
          const buf = [];
          i++;
          while (i < lines.length && !lines[i].trim().startsWith(m[1])) buf.push(lines[i++]);
          i++;
          out.push(`<pre><code${m[2] ? ` class="lang-${esc(m[2])}"` : ""}>${esc(buf.join("\n"))}</code></pre>`);
          continue;
        }
        if (!line.trim()) { i++; continue; }
        if ((m = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
        if (HR.test(line)) { out.push("<hr>"); i++; continue; }
        if (/^\s*>/.test(line)) {
          const buf = [];
          while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
          out.push(`<blockquote>${render(buf.join("\n"), false)}</blockquote>`);
          continue;
        }
        if (line.includes("|") && i + 1 < lines.length && TABLE_SEP(lines[i + 1])) {
          const cells = l => l.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
          const head = cells(line);
          const align = cells(lines[i + 1]).map(c => /^:-+:$/.test(c) ? "center" : /-:$/.test(c) ? "right" : /^:-/.test(c) ? "left" : "");
          const style = k => (align[k] ? ` style="text-align:${align[k]}"` : "");
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim() && lines[i].includes("|")) rows.push(cells(lines[i++]));
          out.push(`<table><thead><tr>${head.map((c, k) => `<th${style(k)}>${inline(c)}</th>`).join("")}</tr></thead><tbody>${
            rows.map(r => `<tr>${head.map((_, k) => `<td${style(k)}>${inline(r[k] ?? "")}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
          continue;
        }
        if (LIST_ITEM.test(line)) {
          const items = [];
          while (i < lines.length) {
            const li = lines[i].match(LIST_ITEM);
            if (li) { items.push({ indent: li[1].replace(/\t/g, "    ").length, ordered: /\d/.test(li[2]), text: li[3], line: top ? i : -1 }); i++; }
            else if (items.length && /^\s{2,}\S/.test(lines[i])) { items[items.length - 1].text += " " + lines[i].trim(); i++; }
            else if (!lines[i].trim() && i + 1 < lines.length && LIST_ITEM.test(lines[i + 1])) i++;
            else break;
          }
          out.push(listHtml(items));
          continue;
        }
        const buf = [line];
        i++;
        while (i < lines.length && lines[i].trim() && !/^\s*(```|~~~|#{1,6}\s|>)/.test(lines[i]) && !LIST_ITEM.test(lines[i]) && !HR.test(lines[i])) buf.push(lines[i++]);
        out.push(`<p>${inline(buf.join("\n"))}</p>`);
      }
      return out.join("\n");
    }

    // ---- front matter and tags: `tags: [a, b]` at the top of the file, plus #tags in the text ----
    const splitFront = t => { const m = t.match(/^---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(\r?\n|$)/); return m ? { front: m[1], len: m[0].length } : null; };
    const cleanTag = s => s.trim().replace(/^["']|["']$/g, "").replace(/^#+/, "").replace(/\s+/g, "-");
    function frontTags(front) {
      const out = [], lines = front.split(/\r?\n/);
      for (let i = 0; i < lines.length; i++) {
        const m = lines[i].match(/^tags\s*:\s*(.*)$/i);
        if (!m) continue;
        const v = m[1].trim();
        if (v.startsWith("[")) out.push(...v.replace(/^\[|\]\s*$/g, "").split(","));
        else if (v) out.push(...v.split(/[,\s]+/));
        else for (let j = i + 1; j < lines.length && /^\s*-\s+/.test(lines[j]); j++) out.push(lines[j].replace(/^\s*-\s+/, ""));
      }
      return out.map(cleanTag).filter(Boolean);
    }
    function inlineTags(text) {
      const found = [];
      let fenced = false;
      for (const line of text.split("\n")) {
        if (/^\s*(```|~~~)/.test(line)) { fenced = !fenced; continue; }
        if (fenced) continue;
        for (const m of line.replace(/`[^`]*`/g, "").matchAll(/(^|[\s(])#([A-Za-z][\w/-]{0,39})(?![\w/-])/g)) found.push(m[2]);
      }
      return found;
    }

    // ---- editor ----
    const $ = id => document.getElementById(id);
    const ta = $("edit");
    const vis = $("vis");
    const bridge = window.alcoveMd; // only present inside Alcove
    const DRAFT = "alcove-md-draft", PREFS = "alcove-md-prefs";
    let file = { path: "", name: "Untitled.md" };
    let saved = "";
    let mode = "visual"; // "visual" | "code" | "split" (code with a live preview)
    let msgTimer;
    let bodyLines = 0; // lines taken by front matter, so preview checkboxes map back to source lines

    const dirty = () => ta.value !== saved;

    // Unsaved edits to a saved file are kept as a draft (per file, in this page's storage), so closing the tab, quitting or a
    // crash doesn't lose them: the next time the file is opened they come back, with an Undo. Untitled documents have their
    // own single draft (DRAFT). Drafts are cleared on save and when the user chooses to discard. At most five, each under
    // 400 KB, so they can't fill the storage that the rest of the app shares.
    const DRAFTS = "alcove-md-drafts", DRAFT_MAX = 400000, DRAFT_KEEP = 5;
    const readDrafts = () => { try { const d = JSON.parse(localStorage.getItem(DRAFTS) || "{}"); return d && typeof d === "object" && !Array.isArray(d) ? d : {}; } catch { return {}; } };
    const writeDrafts = d => {
      const keep = Object.entries(d).sort((a, b) => b[1].at - a[1].at).slice(0, DRAFT_KEEP);
      try { localStorage.setItem(DRAFTS, JSON.stringify(Object.fromEntries(keep))); } catch {}
    };
    function discardDraft(path) { const d = readDrafts(); if (path in d) { delete d[path]; writeDrafts(d); } }
    let draftTimer;
    function flushDraft() {
      clearTimeout(draftTimer);
      if (!file.path) return;
      const d = readDrafts();
      if (dirty() && ta.value.length <= DRAFT_MAX) d[file.path] = { text: ta.value, at: Date.now() };
      else delete d[file.path];
      writeDrafts(d);
    }
    // The draft for this file if it differs from what is on disk (a stale one is dropped), else null.
    function takeDraft(path, disk) {
      const d = readDrafts(), mine = d[path];
      if (!mine || typeof mine.text !== "string") return null;
      if (mine.text === disk) { delete d[path]; writeDrafts(d); return null; }
      return mine.text;
    }
    // Asked by the app before the window closes (see main.js), which also gives the debounced draft its last write.
    window.__alcoveDirty = () => { flushDraft(); return dirty() ? file.name : ""; };
    window.addEventListener("pagehide", flushDraft);
    const say = (t, ms = 2500) => { $("msg").textContent = t; clearTimeout(msgTimer); msgTimer = setTimeout(() => { $("msg").textContent = ""; }, ms); };

    // Edits go through execCommand so the browser's own undo/redo keeps working; if that isn't available the
    // text is set directly (verified below).
    function replaceRange(start, end, text, selStart, selEnd) {
      const before = ta.value, want = before.slice(0, start) + text + before.slice(end);
      ta.focus();
      ta.setSelectionRange(start, end);
      let ok = false;
      // the code view's textarea is hidden while the visual editor shows: never aim execCommand at the other editor
      if (document.activeElement === ta) try { ok = text === "" ? (start === end || document.execCommand("delete")) : document.execCommand("insertText", false, text); } catch {}
      if (ta.value !== want) { ta.value = want; ta.dispatchEvent(new Event("input")); }
      const s = selStart ?? start + text.length;
      ta.setSelectionRange(s, selEnd ?? s);
    }

    // ---- toolbar actions ----
    function lineRange() {
      const v = ta.value, s = ta.selectionStart;
      let e = ta.selectionEnd;
      const a = v.lastIndexOf("\n", s - 1) + 1;
      if (e > s && v[e - 1] === "\n") e--;
      let b = v.indexOf("\n", e);
      if (b < 0) b = v.length;
      return [a, b];
    }
    function mapLines(fn) {
      const [a, b] = lineRange();
      const out = ta.value.slice(a, b).split("\n").map(fn).join("\n");
      replaceRange(a, b, out, a, a + out.length);
    }
    const MARK = /^(\s*)(#{1,6}\s+|>\s?|[-*+]\s+(?:\[[ xX]\]\s+)?|\d+[.)]\s+)/;
    const stripMark = l => l.replace(MARK, "$1");

    function wrap(before, after = before, placeholder = "text") {
      const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd, sel = v.slice(s, e);
      if (s >= before.length && v.slice(s - before.length, s) === before && v.slice(e, e + after.length) === after && !(before === "*" && v[s - 2] === "*")) {
        replaceRange(s - before.length, e + after.length, sel, s - before.length, s - before.length + sel.length); // already wrapped: unwrap
        return;
      }
      const text = sel || placeholder;
      replaceRange(s, e, before + text + after, s + before.length, s + before.length + text.length);
    }

    function currentBlockCode() {
      const v = ta.value, s = ta.selectionStart;
      const a = v.lastIndexOf("\n", s - 1) + 1;
      let b = v.indexOf("\n", s);
      if (b < 0) b = v.length;
      const line = v.slice(a, b);
      let fences = 0;
      for (const l of v.slice(0, a).split("\n")) if (/^\s*(```|~~~)/.test(l)) fences++;
      if (fences % 2 === 1 || /^\s*(```|~~~)/.test(line)) return "code";
      const h = line.match(/^(#{1,6})\s/);
      if (h) return "h" + h[1].length;
      if (/^\s*>/.test(line)) return "quote";
      if (/^\s*[-*+]\s+\[[ xX]\]\s/.test(line)) return "todo";
      if (/^\s*[-*+]\s/.test(line)) return "ul";
      if (/^\s*\d+[.)]\s/.test(line)) return "ol";
      return "p";
    }

    function setBlockCode(kind) {
      if (kind === "code") {
        const [a, b] = lineRange();
        const text = ta.value.slice(a, b);
        if (text.trim()) replaceRange(a, b, "```\n" + text + "\n```");
        else replaceRange(a, b, "```\n\n```", a + 4);
        return;
      }
      const cur = currentBlockCode();
      if (kind === cur && kind !== "p") kind = "p"; // choosing the same style again turns it off
      let n = 0;
      mapLines(l => {
        if (!l.trim()) return l;
        const plain = stripMark(l);
        if (kind === "p") return plain;
        const indent = plain.match(/^\s*/)[0], rest = plain.slice(indent.length);
        if (/^h[1-6]$/.test(kind)) return "#".repeat(+kind[1]) + " " + rest;
        if (kind === "quote") return "> " + rest;
        if (kind === "ul") return `${indent}- ${rest}`;
        if (kind === "ol") return `${indent}${++n}. ${rest}`;
        if (kind === "todo") return `${indent}- [ ] ${rest}`;
        return l;
      });
    }

    function insertBlock(text, sel) {
      const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
      const before = v.slice(0, s), after = v.slice(e);
      const pre = !before || before.endsWith("\n\n") ? "" : before.endsWith("\n") ? "\n" : "\n\n";
      const post = !after || after.startsWith("\n\n") ? "" : after.startsWith("\n") ? "\n" : "\n\n";
      replaceRange(s, e, pre + text + post, s + pre.length + (sel ? sel[0] : text.length), s + pre.length + (sel ? sel[1] : text.length));
    }

    // Small form shown under the toolbar (this page can't use prompt())
    function ask(title, fields, anchor) {
      const restore = saveSel();
      return new Promise(resolve => {
        const pop = document.createElement("form");
        pop.className = "pop";
        pop.innerHTML = `<h4>${esc(title)}</h4>` + fields.map((f, k) => `<label>${esc(f.label)}<input name="f${k}" type="${f.type || "text"}" value="${esc(f.value || "")}" placeholder="${esc(f.placeholder || "")}" autocomplete="off" spellcheck="false"${f.min ? ` min="${f.min}" max="${f.max}"` : ""}></label>`).join("")
          + `<div class="row"><button type="button" data-x>Cancel</button><button class="primary" type="submit">OK</button></div>`;
        const r = anchor.getBoundingClientRect();
        pop.style.top = `${r.bottom + 6}px`;
        pop.style.left = `${Math.max(8, Math.min(r.left, innerWidth - 290))}px`;
        const done = values => { pop.remove(); document.removeEventListener("mousedown", away, true); restore(); resolve(values); };
        const away = e => { if (!pop.contains(e.target)) done(null); };
        pop.addEventListener("submit", e => { e.preventDefault(); done(fields.map((_, k) => pop.elements[`f${k}`].value.trim())); });
        pop.addEventListener("keydown", e => { if (e.key === "Escape") { e.stopPropagation(); done(null); } });
        pop.querySelector("[data-x]").onclick = () => done(null);
        fields.forEach((f, k) => { // suggestions: click one to add it to the field
          if (!f.suggest || !f.suggest.length) return;
          const box = document.createElement("div");
          box.className = "sugs";
          box.append(Object.assign(document.createElement("h5"), { textContent: "Suggestions" }));
          for (const w of f.suggest) {
            const b = Object.assign(document.createElement("button"), { type: "button", textContent: w });
            b.onclick = () => { const i = pop.elements[`f${k}`]; i.value = (i.value.trim() ? i.value.replace(/[,\s]*$/, "") + ", " : "") + w; i.focus(); };
            box.append(b);
          }
          pop.insertBefore(box, pop.querySelector(".row"));
        });
        document.body.append(pop);
        setTimeout(() => document.addEventListener("mousedown", away, true), 0);
        const first = pop.querySelector("input");
        first.focus();
        first.select();
      });
    }

    function menu(items, anchor) {
      document.querySelector(".menu")?.remove();
      const m = document.createElement("div");
      m.className = "menu";
      for (const it of items) {
        if (it === "-") { m.append(Object.assign(document.createElement("div"), { className: "sep" })); continue; }
        if (it.head) { m.append(Object.assign(document.createElement("div"), { className: "head", textContent: it.head })); continue; }
        const b = document.createElement("button");
        b.className = it.on ? "on" : "";
        b.append(it.label);
        if (it.keys) b.append(Object.assign(document.createElement("kbd"), { textContent: it.keys }));
        b.onclick = () => { m.remove(); it.run(); };
        m.append(b);
      }
      const r = anchor.getBoundingClientRect();
      m.style.top = `${r.bottom + 6}px`;
      m.style.left = `${Math.max(8, Math.min(r.left, innerWidth - 230))}px`;
      document.body.append(m);
      const away = e => { if (!m.contains(e.target)) { m.remove(); document.removeEventListener("mousedown", away, true); } };
      setTimeout(() => document.addEventListener("mousedown", away, true), 0);
    }

    const copyText = (text, msg) => {
      const t = document.createElement("textarea");
      t.value = text;
      document.body.append(t);
      t.select();
      document.execCommand("copy");
      t.remove();
      ta.focus();
      say(msg);
    };

    // ---- visual editor: a page you edit directly; every change is written back into the Markdown text ----
    const visual = () => mode === "visual";
    const inVis = () => { const sel = getSelection(); return !!sel.rangeCount && vis.contains(sel.anchorNode); };
    try { document.execCommand("defaultParagraphSeparator", false, "p"); document.execCommand("styleWithCSS", false, false); } catch {}
    const up = (node, re) => { for (let n = node; n && n !== vis; n = n.parentNode) if (n.nodeType === 1 && re.test(n.tagName)) return n; return null; };
    const blockEl = node => up(node, /^(P|DIV|H[1-6]|LI|BLOCKQUOTE|PRE|TD|TH)$/);
    function caretTo(node, atEnd) {
      const r = document.createRange(), sel = getSelection();
      r.selectNodeContents(node);
      r.collapse(!atEnd);
      sel.removeAllRanges();
      sel.addRange(r);
    }

    // The cursor or selection of whichever editor is showing, so a popover can give it back afterwards
    function saveSel() {
      if (visual()) {
        const sel = getSelection(), r = sel.rangeCount && vis.contains(sel.anchorNode) ? sel.getRangeAt(0).cloneRange() : null;
        return () => { vis.focus(); if (r) { const s2 = getSelection(); s2.removeAllRanges(); s2.addRange(r); } };
      }
      const a = [ta.selectionStart, ta.selectionEnd];
      return () => { ta.focus(); ta.setSelectionRange(a[0], a[1]); };
    }

    let visDirty = false, visTimer;
    function enableBoxes() { // freshly rendered or inserted content: tick boxes work, tag chips are whole units
      for (const b of vis.querySelectorAll("input[type=checkbox]")) { b.removeAttribute("disabled"); b.removeAttribute("data-line"); }
      for (const c of vis.querySelectorAll("span.tag")) c.contentEditable = "false";
    }
    function renderVisual() {
      const body = bodyOf(ta.value);
      vis.innerHTML = body.trim() ? render(body) : "<p><br></p>";
      enableBoxes();
      vis.classList.toggle("is-empty", !body.trim());
      visDirty = false;
    }

    // ---- page → Markdown ----
    const BLOCK_TAGS = new Set(["P", "DIV", "H1", "H2", "H3", "H4", "H5", "H6", "UL", "OL", "LI", "BLOCKQUOTE", "PRE", "HR", "TABLE", "THEAD", "TBODY", "TR", "FIGURE", "SECTION", "ARTICLE"]);
    const isBlock = n => n.nodeType === 1 && BLOCK_TAGS.has(n.tagName);
    const escText = t => t.replace(/\u00a0/g, " ").replace(/\u200b/g, "")
      .replace(/\\(?=[\\`*_~#>+\-.!|\[\]()<])/g, "\\\\").replace(/([*`])/g, "\\$1")
      .replace(/(^|[^\w])_|_(?=[^\w]|$)/g, m => m.replace("_", "\\_")).replace(/~~/g, "\\~\\~");
    const escBlockStart = t => t.replace(/^(\s*)(#{1,6}(?=\s)|>|[-+](?=\s)|```|~~~)/gm, "$1\\$2").replace(/^(\s*\d+)([.)])(?=\s)/gm, "$1\\$2");
    const mark = (m, t) => { if (!t.trim()) return t; return t.match(/^\s*/)[0] + m + t.trim() + m + t.match(/\s*$/)[0]; };
    function codeSpan(text) {
      const t = text.replace(/\u200b/g, "");
      if (!t) return "";
      const ticks = "`".repeat((t.match(/`+/g) || []).reduce((a, x) => Math.max(a, x.length), 0) + 1);
      return ticks + (/^`|`$/.test(t) ? ` ${t} ` : t) + ticks;
    }

        const x = Object.assign(document.createElement("button"), { className: "unload", title: "Unmount this folder. Its files stay where they are." });
