        x.onclick = e => { e.stopPropagation(); unmountFolder(f.root); };
        head.addEventListener("contextmenu", e => {
          e.preventDefault();
          menu([
            { label: "New note here", run: () => { pickedDir = f.root; newInFolder("file", b); } },
            { label: "New folder here", run: () => { pickedDir = f.root; newInFolder("dir", b); } },
            { label: "Refresh", run: refreshTree },
            { label: /Mac/.test(navigator.userAgent) ? "Show in Finder" : "Show in file explorer", run: () => bridge && bridge.reveal(f.root) },
            { label: "Copy path", run: () => copyText(f.root, "Path copied") },
            "-",
            { label: "Unmount", run: () => unmountFolder(f.root) },
            { label: "Unmount and forget", run: () => unmountFolder(f.root, true) },
          ], { getBoundingClientRect: () => ({ bottom: e.clientY, left: e.clientX }) });
        });
        head.append(b, x);
        box.append(head);
        if (open) {
          walk(f.root, 1);
          if (!(dirCache.get(f.root) || []).length) box.append(Object.assign(document.createElement("div"), { className: "side-empty", textContent: "No Markdown files here yet. Use New note to start one." }));
        }
      }
    }

    // quiet: a folder coming back at start-up shouldn't force the panel open
    function adoptFolder(r, quiet) { // r: { root, entries }
      if (!folders.some(f => f.root === r.root)) { folders.push({ root: r.root, name: base(r.root) }); persistFolders(); }
      dirCache.set(r.root, r.entries || []);
      expanded.add(r.root);
      pickedDir = r.root;
      G.raw = G.data = null;
      if (mode === "graph") loadGraph(true);
      if (quiet) renderTree(); else setSide(true, "files");
    }
    // The page's side of unmounting: forget the folder's listing and refresh what depends on it
    function dropFolder(dir) {
      const i = folders.findIndex(f => f.root === dir);
      if (i < 0) return;
      folders.splice(i, 1);
      for (const k of [...dirCache.keys()]) if (under(k, dir)) dirCache.delete(k);
      for (const k of [...expanded]) if (under(k, dir)) expanded.delete(k);
      if (under(pickedDir, dir)) pickedDir = folders[0] ? folders[0].root : "";
      G.raw = G.data = null;
      if (mode === "graph") loadGraph(true);
      renderTree();
      if (side.open && side.tab === "search") runSearch();
    }
    // A note from the folder that's open stays open (and can still be saved); the folder just stops being listed and searched
    function unmountFolder(dir, forget) {
      if (!folders.some(f => f.root === dir)) return;
      dropFolder(dir);
      persistFolders();
      if (bridge) bridge.unmount(dir, !!forget);
      sayUndo(forget ? `Unmounted and forgot ${base(dir)}` : `Unmounted ${base(dir)}`, forget ? null : () => restoreFolders([dir], false));
    }
    // other editor tabs share the mounted set: mounting or unmounting in one shows up in the rest
    window.addEventListener("storage", e => {
      if (e.key !== FOLDERS) return;
      let want = [];
      try { want = JSON.parse(e.newValue || "[]"); } catch {}
      for (const f of [...folders]) if (!want.includes(f.root)) dropFolder(f.root);
      const add = want.filter(d => !folders.some(f => f.root === d));
      if (add.length) restoreFolders(add, true);
    });
    async function chooseFolder() {
      if (!bridge) return say("Open this page in Alcove to use folders.");
      const r = await bridge.openFolder();
      if (!r) return;
      if (r.error) return say(r.error, 5000);
      adoptFolder(r);
    }
    async function restoreFolders(paths, quiet = true) {
      restoring++;
      try {
        for (const path of paths) {
          const r = bridge && await bridge.folder(path);
          if (r && !r.error) adoptFolder(r, quiet);
        }
      } finally { restoring--; }
      persistFolders(); // folders that have gone missing drop out of the list
    }
    async function refreshTree() {
      if (!folders.length) return;
      G.raw = G.data = null; // the notes may have changed
      const shown = [...expanded];
      dirCache.clear();
      for (const d of shown) await loadDir(d, true);
      renderTree();
    }
    async function newInFolder(kind, anchor) {
      if (!folders.length || !confirmDiscard()) return; // the new note replaces what's open
      const dir = pickedDir || folders[0].root;
      const r = await ask(kind === "file" ? "New note" : "New folder", [{ label: `In ${base(dir)}`, placeholder: kind === "file" ? "Untitled" : "Folder name" }], anchor);
      if (!r || !r[0]) return;
      const made = await (kind === "file" ? bridge.newFile(dir, r[0]) : bridge.newFolder(dir, r[0]));
      if (made.error) return say(made.error, 5000);
      expanded.add(dir);
      await loadDir(dir, true);
      renderTree();
      if (kind === "file") openFile(made.path, true, true);
    }

    // ---- search: text or #tags across every loaded folder ----
    let searchRun = 0, searchTimer = 0;
    const markIn = (parent, text, at, len) => { // text with the match highlighted
      parent.append(text.slice(0, at), Object.assign(document.createElement("mark"), { textContent: text.slice(at, at + len) }), text.slice(at + len));
    };

    function searchFor(q) { // from a tag chip: look for that tag
      $("sq").value = q;
      setSide(true, "search");
      runSearch();
    }

    async function runSearch() {
      const id = ++searchRun, q = $("sq").value.trim(), box = $("sresults"), stat = $("sstat");
      if (!folders.length) {
        stat.textContent = "";
        const e = Object.assign(document.createElement("div"), { className: "side-empty", textContent: "Mount a folder to search the notes in it." });
        const b = Object.assign(document.createElement("button"), { textContent: "Mount folder…" });
        b.onclick = chooseFolder;
        e.append(document.createElement("br"), b);
        return box.replaceChildren(e);
      }
      if (!bridge) { stat.textContent = "Open this page in Alcove to search folders."; return box.replaceChildren(); }
      stat.textContent = q ? "Searching…" : "";
      const roots = $("s-scope").value ? [$("s-scope").value] : folders.map(f => f.root);
      const r = await bridge.search({ roots, q, matchCase: $("s-case").checked, regex: $("s-re").checked });
      if (id !== searchRun) return; // a newer search has started
      if (r.error) { stat.textContent = r.error; return box.replaceChildren(); }
      if (!q) { // nothing typed: offer the tags in use
        stat.textContent = r.tags.length ? `${r.tags.length} tags in ${r.files} notes` : `${r.files} notes, none tagged yet`;
        const cloud = Object.assign(document.createElement("div"), { className: "tagcloud" });
        for (const [tag, n] of r.tags) {
          const b = document.createElement("button");
          b.append("#" + tag, Object.assign(document.createElement("span"), { textContent: n }));
          b.onclick = () => searchFor("#" + tag);
          cloud.append(b);
        }
        const hint = Object.assign(document.createElement("div"), { className: "shint", textContent: "Type to search note text. Start with # to find a tag." });
        return box.replaceChildren(hint, cloud);
      }
      const notes = r.results.length;
      stat.textContent = notes ? `${r.total || notes} ${r.tagMode ? "tagged" : "match" + (r.total === 1 ? "" : "es")} in ${notes} note${notes === 1 ? "" : "s"}${r.truncated ? " (showing the first ones)" : ""}` : `Nothing found in ${r.files} notes`;
      const multi = folders.length > 1;
      box.replaceChildren(...r.results.map(res => {
        const wrap = Object.assign(document.createElement("div"), { className: "sfile" });
        const head = document.createElement("button");
        head.title = res.path;
        const dir = res.rel.includes("/") ? res.rel.slice(0, res.rel.lastIndexOf("/")) : "";
        head.append(res.name.replace(/\.(md|markdown|mdown|mkd)$/i, ""), Object.assign(document.createElement("span"), { className: "rel", textContent: (multi ? base(res.root) + (dir ? "/" : "") : "") + dir }));
        head.append(Object.assign(document.createElement("span"), { className: "n", textContent: res.matches.length ? String(res.matches.length) : "name" }));
        head.onclick = () => openAt(res, null);
        wrap.append(head);
        if (res.tags.length) wrap.append(Object.assign(document.createElement("div"), { className: "stags" }, ...[]));
        if (res.tags.length) wrap.lastChild.append(...res.tags.map(t => Object.assign(document.createElement("span"), { textContent: "#" + t })));
        const show = (list, parent) => {
          for (const m of list) {
            const b = document.createElement("button");
            b.className = "smatch";
            b.title = `Line ${m.line}`;
            const tx = document.createElement("span");
            tx.className = "tx";
            markIn(tx, m.text, m.at, m.len);
            b.append(Object.assign(document.createElement("span"), { className: "ln", textContent: m.line }), tx);
            b.onclick = () => openAt(res, m);
            parent.append(b);
          }
        };
        show(res.matches.slice(0, 6), wrap);
        if (res.matches.length > 6) {
          const more = Object.assign(document.createElement("button"), { className: "smatch", textContent: `${res.matches.length - 6} more in this note…` });
          more.onclick = () => { more.remove(); show(res.matches.slice(6), wrap); };
          wrap.append(more);
        }
        return wrap;
      }));
    }

    // Open the note and put the cursor on the match
    async function openAt(res, m) {
      if (file.path !== res.path) {
        await openFile(res.path, true);
        if (file.path !== res.path) return; // cancelled, or couldn't be read
      }
      if (m) { if (mode === "visual") jumpVisual(m); else jumpCode(m); }
    }
    function jumpCode(m) {
      const lines = ta.value.split("\n");
      const pos = lines.slice(0, m.line - 1).reduce((n, l) => n + l.length + 1, 0) + m.col;
      ta.focus();
      ta.setSelectionRange(pos, pos + m.len);
      ta.scrollTop = Math.max(0, (m.line - 4) * parseFloat(getComputedStyle(ta).lineHeight));
    }
    function jumpVisual(m) { // the nth time that text appears on the page; if it isn't visible text (a link address, front matter), show the source
      const want = (m.found || ta.value.split("\n")[m.line - 1].slice(m.col, m.col + m.len)), exact = $("s-case").checked && !$("s-re").checked;
      const walker = document.createTreeWalker(vis, NodeFilter.SHOW_TEXT);
      let seen = 0;
      for (let n = walker.nextNode(); n; n = walker.nextNode()) {
        const hay = exact ? n.nodeValue : n.nodeValue.toLowerCase(), needle = exact ? want : want.toLowerCase();
        for (let i = hay.indexOf(needle); i >= 0; i = hay.indexOf(needle, i + 1)) {
          if (seen++ < m.nth) continue;
          const r = document.createRange(), sel = getSelection();
          r.setStart(n, i);
          r.setEnd(n, i + want.length);
          vis.focus();
          sel.removeAllRanges();
          sel.addRange(r);
          n.parentElement.scrollIntoView({ block: "center", behavior: "smooth" });
          return;
        }
      }
      setMode("code");
      jumpCode(m);
      say("That match is in the Markdown itself, so the Code view is showing it.", 4000);
    }

    $("sq").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 250); });
    $("sq").addEventListener("keydown", e => {
      if (e.key === "Enter") { clearTimeout(searchTimer); runSearch(); }
      else if (e.key === "Escape") { e.target.value = ""; runSearch(); }
    });
    for (const id of ["s-case", "s-re", "s-scope"]) $(id).addEventListener("change", runSearch);
    document.addEventListener("keydown", e => { // ⌘/Ctrl+Shift+F
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === "f") { e.preventDefault(); setSide(true, "search"); $("sq").focus(); $("sq").select(); }
    });

    // ---- graph view: notes are nodes, links between notes are lines ----
    const G = { raw: null, only: "", data: null, nodes: [], links: [], pos: new Map(), view: { x: 0, y: 0, k: 1 }, alpha: 0, hover: null, drag: null, pan: null, raf: 0,
      scope: "all", depth: 1, opts: { tags: false, ghost: false, orph: true }, query: "", w: 0, h: 0, dpr: 1 };
    const gcv = $("gcanvas"), gctx = gcv.getContext("2d");
    const hueOf = str => { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
    const isDark = () => matchMedia("(prefers-color-scheme: dark)").matches;

    // Every loaded folder is scanned on its own and the results are joined; "only" narrows it to one folder.
    function mergeGraphs(parts) {
      const out = { nodes: [], edges: [], ghosts: [], truncated: false };
      for (const r of parts) {
        const off = out.nodes.length;
        for (const n of r.nodes) out.nodes.push({ ...n, root: r.root });
        for (const [a, b] of r.edges) out.edges.push([a + off, b + off]);
        for (const g of r.ghosts) out.ghosts.push({ name: g.name, from: g.from.map(i => i + off), root: r.root });
        out.truncated = out.truncated || r.truncated;
      }
      return out;
    }
    function pickData() {
      const raw = G.raw;
      if (!G.only || !folders.some(f => f.root === G.only)) { G.only = ""; return raw; }
      const map = new Map(), nodes = [];
      raw.nodes.forEach((n, i) => { if (n.root === G.only) { map.set(i, nodes.length); nodes.push(n); } });
      return {
        nodes,
        edges: raw.edges.filter(([a, b]) => map.has(a) && map.has(b)).map(([a, b]) => [map.get(a), map.get(b)]),
        ghosts: raw.ghosts.filter(g => g.root === G.only).map(g => ({ name: g.name, root: g.root, from: g.from.map(i => map.get(i)).filter(i => i != null) })),
        truncated: raw.truncated,
      };
    }
    function fillFolderPicker() {
      $("gfolderbox").hidden = folders.length < 2;
      const sel = $("gfolder");
      sel.replaceChildren(new Option("All folders", ""), ...folders.map(f => new Option(f.name, f.root)));
      sel.value = folders.some(f => f.root === G.only) ? G.only : "";
    }

    async function loadGraph(force) {
      const empty = $("gempty");
      if (!folders.length) {
        G.raw = G.data = null; G.nodes = []; G.links = [];
        empty.hidden = false;
        empty.querySelector("h2").textContent = "No folder mounted";
        empty.querySelector("p").textContent = "Mount a folder to see how its notes link to each other.";
        $("gfolderbox").hidden = true;
        $("gstat").textContent = "";
        return draw();
      }
      empty.hidden = true;
      if (!G.raw || force) {
        $("gstat").textContent = "Reading notes…";
        const parts = bridge ? await Promise.all(folders.map(f => bridge.graph(f.root))) : [{ error: "Open this page in Alcove to use folders." }];
        const bad = parts.find(r => r.error);
        if (bad) { $("gstat").textContent = ""; return say(bad.error, 5000); }
        G.raw = mergeGraphs(parts);
      }
      fillFolderPicker();
      G.data = pickData();
      buildGraph(true);
    }

    function buildGraph(refit) {
      const d = G.data;
      if (!d) return;
      for (const n of G.nodes) G.pos.set(n.id, { x: n.x, y: n.y }); // keep what's already laid out where it is
      const cur = d.nodes.findIndex(n => n.path === file.path);
      const all = [], idOf = new Map();
      const add = (id, o) => { const prev = G.pos.get(id); idOf.set(id, all.length); all.push({ id, x: prev ? prev.x : NaN, y: prev ? prev.y : NaN, vx: 0, vy: 0, deg: 0, ...o }); };
      d.nodes.forEach((n, i) => add("n" + i, { type: "note", label: n.name, path: n.path, folder: n.folder, root: n.root, tags: n.tags, words: n.words, cur: i === cur }));
      const links = d.edges.map(([x, y]) => [idOf.get("n" + x), idOf.get("n" + y)]);
      if (G.opts.ghost) d.ghosts.forEach((g, gi) => { add("g" + gi, { type: "ghost", label: g.name, root: g.root, tags: [], folder: "" }); for (const f of g.from) links.push([idOf.get("n" + f), idOf.get("g" + gi)]); });
      if (G.opts.tags) {
        const tags = new Map();
        d.nodes.forEach((n, i) => n.tags.forEach(t => { if (!tags.has(t)) tags.set(t, []); tags.get(t).push(i); }));
        for (const [t, from] of tags) { add("t" + t, { type: "tag", label: "#" + t, tags: [], folder: "" }); for (const f of from) links.push([idOf.get("n" + f), idOf.get("t" + t)]); }
      }
      const deg = new Array(all.length).fill(0);
      for (const [x, y] of links) { deg[x]++; deg[y]++; }
      let keep = new Set(all.keys());
      if (G.scope === "local" && cur >= 0) { // the open note and everything within `depth` steps
        const near = new Map(all.map((_, i) => [i, []]));
        for (const [x, y] of links) { near.get(x).push(y); near.get(y).push(x); }
        keep = new Set([idOf.get("n" + cur)]);
        let edge = [...keep];
        for (let step = 0; step < G.depth; step++) { const nxt = []; for (const i of edge) for (const j of near.get(i)) if (!keep.has(j)) { keep.add(j); nxt.push(j); } edge = nxt; }
      }
      if (!G.opts.orph) all.forEach((n, i) => { if (n.type === "note" && deg[i] === 0) keep.delete(i); });
      const remap = new Map();
      G.nodes = [];
      all.forEach((n, i) => { if (keep.has(i)) { remap.set(i, G.nodes.length); n.i = G.nodes.length; G.nodes.push(n); } });
      G.links = links.filter(([x, y]) => keep.has(x) && keep.has(y)).map(([x, y]) => [remap.get(x), remap.get(y)]);
      for (const n of G.nodes) n.deg = 0;
      for (const [x, y] of G.links) { G.nodes[x].deg++; G.nodes[y].deg++; }
      G.nodes.forEach((n, i) => {
        n.r = n.type === "tag" ? 4 + Math.sqrt(n.deg) * 1.6 : 3.2 + Math.min(Math.sqrt(n.deg) * 1.9, 11) + (n.cur ? 2 : 0);
        n.hue = n.type === "tag" ? 275 : n.type === "ghost" ? 0 : folders.length > 1 && n.root ? hueOf(base(n.root)) : n.folder ? hueOf(n.folder.split("/")[0]) : 215; // with several folders, colour by folder
        if (Number.isNaN(n.x)) { const a2 = i * 2.4, rad = 16 * Math.sqrt(i + 1); n.x = Math.cos(a2) * rad; n.y = Math.sin(a2) * rad; }
      });
      $("gstat").textContent = `${G.nodes.filter(n => n.type === "note").length} notes · ${G.links.length} links${G.data.truncated ? " (first 3000 notes)" : ""}`;
      G.alpha = 1;
      const warm = G.nodes.length > 1200 ? 40 : 160;
      for (let i = 0; i < warm; i++) step();
      if (refit) fitGraph();
      run();
    }

    function step() {
      const ns = G.nodes, a = G.alpha, C = 90, grid = new Map();
      for (const n of ns) { const key = Math.floor(n.x / C) + "," + Math.floor(n.y / C); let b = grid.get(key); if (!b) grid.set(key, b = []); b.push(n); }
      for (const n of ns) {
        const cx = Math.floor(n.x / C), cy = Math.floor(n.y / C);
        for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
          const cell = grid.get((cx + ox) + "," + (cy + oy));
          if (!cell) continue;
          for (const m of cell) {
            if (m.i <= n.i) continue;
            let dx = n.x - m.x, dy = n.y - m.y, d2 = dx * dx + dy * dy;
            if (d2 > 4 * C * C) continue;
            if (d2 < 0.01) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = dx * dx + dy * dy + .01; }
            const d = Math.sqrt(d2), f = 1500 / (d2 + 120);
            n.vx += dx / d * f; n.vy += dy / d * f; m.vx -= dx / d * f; m.vy -= dy / d * f;
          }
        }
      }
      for (const [x, y] of G.links) {
        const p = ns[x], q = ns[y], dx = q.x - p.x, dy = q.y - p.y, d = Math.sqrt(dx * dx + dy * dy) || 1, f = (d - 58) * 0.035;
        p.vx += dx / d * f; p.vy += dy / d * f; q.vx -= dx / d * f; q.vy -= dy / d * f;
      }
      for (const n of ns) {
        if (n.fixed) { n.vx = n.vy = 0; continue; }
        n.vx -= n.x * 0.0028; n.vy -= n.y * 0.0028; // gentle pull to the middle keeps loose notes from drifting away
        n.vx *= 0.78; n.vy *= 0.78;
        n.x += n.vx * Math.max(a, 0.25); n.y += n.vy * Math.max(a, 0.25);
      }
      G.alpha = G.drag ? Math.max(G.alpha * 0.99, 0.35) : G.alpha * 0.985;
    }

    function fitGraph() {
      const ns = G.nodes;
      if (!ns.length || !G.w) return;
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const n of ns) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); }
      const k = Math.min(2, Math.max(0.1, Math.min(G.w / (x1 - x0 + 120), G.h / (y1 - y0 + 160))));
      G.view = { k, x: G.w / 2 - (x0 + x1) / 2 * k, y: G.h / 2 + 20 - (y0 + y1) / 2 * k };
      G.moved = false;
    }

    const matches = n => { const q = G.query; return !q || (q.startsWith("#") ? n.tags.some(t => ("#" + t.toLowerCase()).includes(q)) || n.label.toLowerCase().includes(q) : n.label.toLowerCase().includes(q)); };
    function neighbours(i) { const out = new Set([i]); for (const [x, y] of G.links) { if (x === i) out.add(y); else if (y === i) out.add(x); } return out; }

    function draw() {
      const w = G.w, h = G.h, dpr = G.dpr, v = G.view, ns = G.nodes, dark = isDark();
      gctx.setTransform(1, 0, 0, 1, 0, 0);
      gctx.clearRect(0, 0, gcv.width, gcv.height);
      if (!ns.length) return;
      gctx.setTransform(dpr * v.k, 0, 0, dpr * v.k, dpr * v.x, dpr * v.y);
      const ink = dark ? "255,255,255" : "20,20,30";
      const focus = G.hover != null ? neighbours(G.hover) : null;
      const searching = !!G.query;
      // links
      gctx.lineWidth = 1 / v.k;
      for (const [x, y] of G.links) {
        const p = ns[x], q = ns[y], hot = focus && focus.has(x) && focus.has(y) && (x === G.hover || y === G.hover);
        const dim = (focus && !hot) || (searching && !(matches(p) || matches(q)));
        gctx.strokeStyle = hot ? `hsla(${p.hue},80%,${dark ? 70 : 45}%,.9)` : `rgba(${ink},${dim ? 0.04 : 0.17})`;
        gctx.lineWidth = (hot ? 1.8 : 1) / v.k;
        gctx.beginPath(); gctx.moveTo(p.x, p.y); gctx.lineTo(q.x, q.y); gctx.stroke();
      }
      // nodes
      const glow = dark && ns.length <= 700;
      for (const n of ns) {
        const lit = (!focus || focus.has(n.i)) && (!searching || matches(n));
        const alpha = lit ? 1 : 0.18;
        const col = n.type === "ghost" ? `rgba(${ink},${0.45 * alpha})` : `hsla(${n.hue},${n.type === "tag" ? 70 : 62}%,${dark ? 66 : 48}%,${alpha})`;
        if (glow && lit) {
          const g = gctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 3.4);
          g.addColorStop(0, `hsla(${n.hue},80%,65%,.34)`); g.addColorStop(1, `hsla(${n.hue},80%,65%,0)`);
          gctx.fillStyle = g; gctx.beginPath(); gctx.arc(n.x, n.y, n.r * 3.4, 0, 6.2832); gctx.fill();
        }
        gctx.beginPath(); gctx.arc(n.x, n.y, n.r, 0, 6.2832);
        if (n.type === "ghost") { gctx.strokeStyle = col; gctx.lineWidth = 1.2 / v.k; gctx.stroke(); } else { gctx.fillStyle = col; gctx.fill(); }
        if (n.cur) { gctx.strokeStyle = `rgba(${ink},.9)`; gctx.lineWidth = 2 / v.k; gctx.beginPath(); gctx.arc(n.x, n.y, n.r + 3 / v.k, 0, 6.2832); gctx.stroke(); }
      }
      // labels: all of them when zoomed in, otherwise the big ones, the open note, and whatever is hovered or matched
      gctx.font = `${12 / v.k}px -apple-system, "Segoe UI", system-ui, sans-serif`;
      gctx.textAlign = "center";
      gctx.lineJoin = "round";
      for (const n of ns) {
        const lit = (!focus || focus.has(n.i)) && (!searching || matches(n));
        const show = n.i === G.hover || (focus && focus.has(n.i)) || n.cur || (searching && matches(n)) || (lit && (v.k > 1.1 || (v.k > 0.5 && n.deg >= 6)));
        if (!show) continue;
        const y = n.y + n.r + 12 / v.k;
        gctx.lineWidth = 3 / v.k;
        gctx.strokeStyle = dark ? "rgba(20,20,26,.85)" : "rgba(255,255,255,.85)";
        gctx.strokeText(n.label, n.x, y);
        gctx.fillStyle = `rgba(${ink},${lit ? 0.9 : 0.35})`;
        gctx.fillText(n.label, n.x, y);
      }
    }

    function run() { if (!G.raf) G.raf = requestAnimationFrame(frame); }
    function frame() {
      G.raf = 0;
      if (mode !== "graph") return;
      if (G.alpha > 0.02 || G.drag) { step(); step(); }
      draw();
      if (G.alpha > 0.02 || G.drag) run();
    }
    function sizeGraph() {
      const r = $("graphbox").getBoundingClientRect();
      if (!r.width) return;
      G.dpr = devicePixelRatio || 1;
      G.w = r.width; G.h = r.height;
      gcv.width = Math.round(r.width * G.dpr); gcv.height = Math.round(r.height * G.dpr);
      draw();
    }
    new ResizeObserver(() => { if (mode === "graph") { sizeGraph(); if (!G.moved) { fitGraph(); run(); } } }).observe($("graphbox"));

    const toWorld = (cx, cy) => { const r = gcv.getBoundingClientRect(); return [(cx - r.left - G.view.x) / G.view.k, (cy - r.top - G.view.y) / G.view.k]; };
    function nodeAt(cx, cy) {
      const [wx, wy] = toWorld(cx, cy);
      for (let i = G.nodes.length - 1; i >= 0; i--) { const n = G.nodes[i]; if (Math.hypot(n.x - wx, n.y - wy) <= n.r + 3 / G.view.k) return n; }
      return null;
    }
    function tip(n, e) {
      const t = $("gtip");
      if (!n) { t.hidden = true; return; }
      t.replaceChildren(Object.assign(document.createElement("b"), { textContent: n.label }));
      const bits = n.type === "note" ? [(folders.length > 1 ? base(n.root) + (n.folder ? "/" + n.folder : "") : n.folder) || "top level", `${n.words} words`, `${n.deg} link${n.deg === 1 ? "" : "s"}`, n.tags.length ? n.tags.map(x => "#" + x).join(" ") : ""] : [n.type === "tag" ? `${n.deg} note${n.deg === 1 ? "" : "s"}` : "Linked, but no note has this name yet. Click to create it."];
      t.append(Object.assign(document.createElement("span"), { textContent: bits.filter(Boolean).join(" · ") }));
      const r = $("graphbox").getBoundingClientRect();
      t.hidden = false;
      t.style.left = `${Math.min(e.clientX - r.left + 14, r.width - t.offsetWidth - 8)}px`;
      t.style.top = `${Math.min(e.clientY - r.top + 14, r.height - t.offsetHeight - 8)}px`;
    }
    async function openGraphNode(n) {
      if (n.type === "note") return openFile(n.path, true);
      if (n.type === "tag") { $("gsearch").value = n.label; G.query = n.label.toLowerCase(); return run(); }
      const made = await bridge.newFile(n.root || folders[0].root, n.label); // an unresolved link: create the note it points at
      if (made.error) return say(made.error, 5000);
      G.raw = G.data = null;
      await refreshTree();
      openFile(made.path, true, true);
    }

    let gdown = null;
    gcv.addEventListener("pointerdown", e => {
      gcv.setPointerCapture(e.pointerId);
      const n = nodeAt(e.clientX, e.clientY);
      gdown = { x: e.clientX, y: e.clientY, n, moved: false };
      if (n) { G.drag = n; n.fixed = true; } else G.pan = { x: e.clientX - G.view.x, y: e.clientY - G.view.y };
      run();
    });
    gcv.addEventListener("pointermove", e => {
      if (gdown && Math.hypot(e.clientX - gdown.x, e.clientY - gdown.y) > 4) gdown.moved = true;
      if (G.drag) { [G.drag.x, G.drag.y] = toWorld(e.clientX, e.clientY); run(); }
      else if (G.pan) { G.view.x = e.clientX - G.pan.x; G.view.y = e.clientY - G.pan.y; G.moved = true; run(); }
      else {
        const n = nodeAt(e.clientX, e.clientY);
        const i = n ? n.i : null;
        if (i !== G.hover) { G.hover = i; gcv.style.cursor = n ? "pointer" : "grab"; run(); }
        tip(n, e);
      }
    });
    gcv.addEventListener("pointerup", e => {
      const hit = gdown && !gdown.moved && gdown.n;
      if (G.drag) { G.drag.fixed = false; G.drag = null; }
      G.pan = null;
      gdown = null;
      if (hit) openGraphNode(hit);
    });
    gcv.addEventListener("pointerleave", () => { if (!G.drag && !G.pan) { G.hover = null; tip(null); run(); } });
    gcv.addEventListener("wheel", e => {
      e.preventDefault();
      const [wx, wy] = toWorld(e.clientX, e.clientY);
      const k = Math.min(6, Math.max(0.08, G.view.k * Math.exp(-e.deltaY * 0.0016)));
      const r = gcv.getBoundingClientRect();
      G.view = { k, x: e.clientX - r.left - wx * k, y: e.clientY - r.top - wy * k };
      G.moved = true;
      run();
    }, { passive: false });
    gcv.addEventListener("dblclick", e => { if (!nodeAt(e.clientX, e.clientY)) { fitGraph(); run(); } });

    $("gsearch").addEventListener("input", e => { G.query = e.target.value.trim().toLowerCase(); run(); });
    $("gsearch").addEventListener("keydown", e => { if (e.key === "Escape") { e.target.value = ""; G.query = ""; run(); } });
    for (const [id, key] of [["g-tags", "tags"], ["g-ghost", "ghost"], ["g-orph", "orph"]]) $(id).addEventListener("change", e => { G.opts[key] = e.target.checked; buildGraph(false); });
    $("gscope").addEventListener("click", e => {
      const sc = e.target.dataset.s;
      if (!sc) return;
      G.scope = sc;
      for (const b of $("gscope").querySelectorAll("[data-s]")) b.classList.toggle("on", b.dataset.s === sc);
      $("gdepth").hidden = sc !== "local";
      buildGraph(true);
    });
    $("gdm").onclick = () => { G.depth = Math.max(1, G.depth - 1); $("gd").textContent = G.depth; buildGraph(true); };
    $("gdp").onclick = () => { G.depth = Math.min(6, G.depth + 1); $("gd").textContent = G.depth; buildGraph(true); };
    $("gfolder").addEventListener("change", e => { G.only = e.target.value; G.data = pickData(); buildGraph(true); });
    $("gfit").onclick = () => { fitGraph(); run(); };
    $("grefresh").onclick = () => loadGraph(true);
    $("gopen").onclick = chooseFolder;

    // ---- painting ----
    function paintTags(front, inl) {
      const bar = $("tagbar");
      bar.replaceChildren();
      const soft = inl.filter(t => !front.includes(t));
      for (const t of front) {
        const c = document.createElement("span");
        c.className = "chip";
        c.append(`#${t}`);
        const x = document.createElement("button");
        x.textContent = "×";
        x.title = "Remove tag";
        x.onclick = () => setTags(front.filter(y => y !== t));
        c.append(x);
        c.style.cursor = "pointer";
        c.title = "Find notes with this tag";
        c.onclick = e => { if (e.target !== x) searchFor("#" + t); };
        bar.append(c);
      }
      for (const t of [...new Set(soft)]) {
        const c = Object.assign(document.createElement("span"), { className: "chip soft", textContent: `#${t}`, title: "Typed in the text. Click to save it as a tag of this note." });
        c.style.cursor = "pointer";
        c.onclick = () => setTags([...front, t]);
        bar.append(c);
      }
      const add = document.createElement("button");
      add.className = "addtag";
      add.textContent = "+ Tag";
      add.onclick = () => addTag(add);
      bar.append(add);
    }

    function paint() {
      const t = ta.value;
      const fm = splitFront(t);
      const body = fm ? t.slice(fm.len) : t;
      bodyLines = fm ? (t.slice(0, fm.len).match(/\n/g) || []).length : 0;
      const front = fm ? frontTags(fm.front) : [];
      const inl = inlineTags(body);
      const chips = [...front, ...inl.filter(x => !front.includes(x))];
      if (mode === "split") $("doc").innerHTML = body.trim() || front.length
        ? (chips.length ? `<div class="tags">${[...new Set(chips)].map(x => `<span class="tag">#${esc(x)}</span>`).join("")}</div>` : "") + render(body)
        : `<div class="empty"><h2>Nothing to show yet</h2><p>Write something on the left, or open a Markdown file.</p></div>`;
      const words = (body.match(/\S+/g) || []).length;
      $("count").textContent = `${words} ${words === 1 ? "word" : "words"} · ${t ? t.split("\n").length : 0} lines`;
      $("path").textContent = file.path;
      $("name").innerHTML = "";
      $("name").append(file.name, dirty() ? Object.assign(document.createElement("i"), { textContent: " — edited" }) : "");
      document.title = `${dirty() ? "• " : ""}${file.name}`;
      $("save").disabled = !!file.path && !dirty();
      paintTags(front, inl);
      paintOutline();
      syncBlock();
    }
    let paintTimer;
    const paintSoon = () => { clearTimeout(paintTimer); paintTimer = setTimeout(paint, 100); };

    let syncQueued = false;
    function syncBlock() {
      if (syncQueued) return;
      syncQueued = true;
      requestAnimationFrame(() => { syncQueued = false; const s = $("block"); if (s && (visual() ? inVis() : document.activeElement === ta)) s.value = currentBlock(); });
    }
    document.addEventListener("selectionchange", syncBlock);

    function setMode(m, force) {
      const was = mode;
      if (was === "visual" && m !== "visual") flushVisual();
      mode = m;
      document.body.className = m;
      const seg = m === "visual" ? "visual" : m === "graph" ? "graph" : "code";
      for (const b of document.querySelectorAll("#modes button")) b.classList.toggle("on", b.dataset.mode === seg);
      $("splitbtn").hidden = m === "visual" || m === "graph";
      $("splitbtn").classList.toggle("on", m === "split");
      if (m === "visual" && (was !== "visual" || force)) renderVisual();
      paint();
      if (m === "graph") { sizeGraph(); loadGraph(); } else (m === "visual" ? vis : ta).focus();
    }

    // next: "keep" to stay in the current view (switching files in a folder); anything else opens in the view
    // last chosen (Visual unless Code was picked)
    function load(f, text, next) {
      file = f;
      ta.value = text;
      saved = text;
      const kept = f.path ? takeDraft(f.path, text) : null; // unsaved edits from last time
      if (kept !== null) ta.value = kept;
      history.replaceState(null, "", f.path ? `?file=${encodeURIComponent(f.path)}` : location.pathname);
      const chosen = prefs.mode === "code" ? (prefs.split && innerWidth > 900 ? "split" : "code") : "visual";
      setMode(next === "keep" && mode !== "graph" ? mode : chosen, true); // opening a note from the graph leaves the graph
      renderTree();
      if (kept !== null) sayUndo("Restored your unsaved changes", () => { ta.value = saved; discardDraft(f.path); if (visual()) renderVisual(); paint(); });
    }

    const base = p => p.split(/[\\/]/).pop();
    const confirmDiscard = () => {
      if (!dirty()) return true;
      if (!confirm("Discard your unsaved changes?")) return false;
      if (file.path) discardDraft(file.path); // discarded on purpose: not offered again
      return true;
    };

    // fromTree: picked in the folder panel, so the mode stays as it is; fresh: a note just created, so write in it
    async function openFile(path, fromTree, fresh) {
      if (!bridge) return say("Open this page in Alcove to use files.");
      if (!fromTree || !fresh) { if (!confirmDiscard()) return; }
      const r = path ? await bridge.read(path) : await bridge.open();
      if (!r) return;
      if (r.error) return say(r.error, 5000);
      load({ path: r.path, name: base(r.path) }, r.text, fresh ? "edit" : fromTree ? "keep" : path ? "view" : undefined);
      localStorage.removeItem(DRAFT);
    }

    async function save(as) {
      if (!bridge) return say("Open this page in Alcove to save files.");
      flushVisual();
      const text = ta.value;
      const r = !as && file.path ? await bridge.save(file.path, text) : await bridge.saveAs(file.name, text);
      if (!r) return;
      if (r.error) return say(r.error, 5000);
      file = { path: r.path, name: base(r.path) };
      saved = text;
      history.replaceState(null, "", `?file=${encodeURIComponent(r.path)}`);
      localStorage.removeItem(DRAFT);
      discardDraft(r.path);
      paint();
      say("Saved");
      if (folders.length) refreshTree(); // a new file may have landed in a folder
    }

    $("open").onclick = () => openFile();
    $("new").onclick = () => { if (confirmDiscard()) { load({ path: "", name: "Untitled.md" }, "", false); localStorage.removeItem(DRAFT); } };
    $("save").onclick = () => save(false);
    $("saveas").onclick = () => save(true);
    $("openfolder").onclick = chooseFolder;
    $("sidebtn").innerHTML = ICON.panel;
    $("sidebtn").onclick = () => setSide(!side.open);
    $("edge").onclick = () => setSide(!side.open);
    $("sidetabs").onclick = e => { if (e.target.dataset.t) { setSide(true, e.target.dataset.t); if (e.target.dataset.t === "search") $("sq").focus(); } };
    $("f-note").innerHTML = ICON.filePlus;
    $("f-dir").innerHTML = ICON.folderPlus;
    $("f-refresh").innerHTML = ICON.refresh;
    $("f-open").innerHTML = ICON.folder;
    $("f-recent").innerHTML = ICON.clock;
    $("f-note").onclick = e => newInFolder("file", e.currentTarget);
    $("f-dir").onclick = e => newInFolder("dir", e.currentTarget);
    $("f-refresh").onclick = refreshTree;
    $("f-open").onclick = chooseFolder;
    $("f-recent").onclick = async e => {
      const anchor = e.currentTarget; // gone once the await below finishes
      const list = (bridge && await bridge.recentFolders()) || [];
      const items = list.filter(d => !folders.some(f => f.root === d)).map(d => ({ label: base(d), run: () => restoreFolders([d], false) }));
      menu(items.length ? [{ head: "Mount a recent folder" }, ...items, "-", { label: "Forget recent folders", run: async () => { if (bridge) await bridge.forget(); say("Recent folders cleared. Mounted folders are kept."); } }] : [{ head: "No other recent folders" }], anchor);
    };
    $("modes").onclick = e => {
      const m = e.target.dataset.mode;
      if (!m) return;
      if (m === "graph") return setMode("graph"); // a place to look from; opening a note goes back to the last editor
      prefs.mode = m;
      applyPrefs();
      setMode(m === "visual" ? "visual" : prefs.split ? "split" : "code");
    };
    $("splitbtn").onclick = () => {
      prefs.split = mode !== "split";
      applyPrefs();
      setMode(prefs.split ? "split" : "code");
    };

    function docChanged() {
      paintSoon();
      if (!file.path) { try { localStorage.setItem(DRAFT, ta.value); } catch {} } // untitled drafts survive closing the tab
      else { clearTimeout(draftTimer); draftTimer = setTimeout(flushDraft, 250); }  // so do edits to a saved file
    }
    ta.addEventListener("input", docChanged);

    $("doc").addEventListener("click", e => { const chip = e.target.closest && e.target.closest("span.tag"); if (chip) searchFor(chip.textContent.trim()); });

    // Ticking a to-do in the preview edits the matching line in the text
    $("doc").addEventListener("change", e => {
      const box = e.target;
      if (!box.matches || !box.matches("input[type=checkbox][data-line]")) return;
      const lines = ta.value.split("\n"), n = bodyLines + Number(box.dataset.line);
      if (n >= lines.length) return;
      const from = lines.slice(0, n).reduce((c, l) => c + l.length + 1, 0);
      tallyTodo(box.checked);
      const fixed = lines[n].replace(/\[( |x|X)\]/, box.checked ? "[x]" : "[ ]");
      const sel = [ta.selectionStart, ta.selectionEnd];
      replaceRange(from, from + lines[n].length, fixed, sel[0], sel[1]);
    });

    // ---- typing help: keep lists going, indent, shortcuts, paste a link over selected text ----
    const BULLET = /^(\s*)(?:([-*+])|(\d+)([.)]))\s+(\[[ xX]\]\s+)?(.*)$/;
    ta.addEventListener("keydown", e => {
      const v = ta.value, s = ta.selectionStart, m = e.metaKey || e.ctrlKey;
      if (e.key === "Enter" && !e.shiftKey && !m && !e.altKey && !e.isComposing && s === ta.selectionEnd) {
        const a = v.lastIndexOf("\n", s - 1) + 1;
        const line = v.slice(a, s);
        const li = line.match(BULLET), q = line.match(/^(\s*>\s?)(.*)$/);
        if (li && s - a >= line.length - li[6].length) {
          e.preventDefault();
          if (!li[6] && !v.slice(s, (v.indexOf("\n", s) < 0 ? v.length : v.indexOf("\n", s))).trim()) { replaceRange(a, s, "", a); return; } // empty item ends the list
          const marker = li[2] ? li[2] : `${+li[3] + 1}${li[4]}`;
          replaceRange(s, s, `\n${li[1]}${marker} ${li[5] ? "[ ] " : ""}`);
          return;
        }
        if (q && q[2]) { e.preventDefault(); replaceRange(s, s, `\n${q[1]}`); return; }
        if (q && !q[2]) { e.preventDefault(); replaceRange(a, s, "", a); return; }
      }
      if (e.key === "Tab" && !m && !e.altKey) {
        e.preventDefault();
        const [a, b] = lineRange();
        const multi = ta.value.slice(ta.selectionStart, ta.selectionEnd).includes("\n");
        const inList = BULLET.test(ta.value.slice(a, b));
        if (e.shiftKey) mapLines(l => l.replace(/^( {1,2}|\t)/, ""));
        else if (multi || inList) mapLines(l => (l.trim() ? "  " + l : l));
        else replaceRange(ta.selectionStart, ta.selectionEnd, "  ");
        return;
      }
      if (!m) return;
      shortcut(e);
    });
    ta.addEventListener("paste", e => {
      const text = e.clipboardData && e.clipboardData.getData("text/plain").trim();
      const sel = ta.value.slice(ta.selectionStart, ta.selectionEnd);
      if (text && sel && !sel.includes("\n") && /^https?:\/\/\S+$/.test(text)) { e.preventDefault(); replaceRange(ta.selectionStart, ta.selectionEnd, `[${sel}](${text})`); }
    });

    document.addEventListener("keydown", e => {
      const k = e.metaKey || e.ctrlKey;
      if (k && e.key.toLowerCase() === "s" && !e.altKey) { e.preventDefault(); e.stopPropagation(); save(e.shiftKey); }
      else if (k && e.key.toLowerCase() === "o") { e.preventDefault(); e.stopPropagation(); openFile(); }
    }, true);
    window.addEventListener("beforeunload", e => { if (dirty() && file.path) { e.preventDefault(); e.returnValue = ""; } });

    // Files dragged onto the page: the app's preload sends the path.
    window.addEventListener("dragenter", () => document.body.classList.add("dragging"));
    window.addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("dragging"); });
    window.addEventListener("drop", () => document.body.classList.remove("dragging"), true);
    window.addEventListener("message", e => { if (e.source === window && e.data && e.data.__alcoveMdDrop) openFile(e.data.__alcoveMdDrop); });

    // Start: ?file=… opens that file for reading (use Edit to change it); ?folder=… or #folder opens a folder;
    // #open shows the file picker; otherwise a blank document, or the last untitled draft. The last folder
    // is reopened unless a particular file was asked for.
    buildToolbar();
    applyPrefs();
    setSide(side.open);
    (async () => {
      const params = new URLSearchParams(location.search);
      const q = params.get("file"), dir = params.get("folder");
      if (q) {
        const r = bridge ? await bridge.read(q) : { error: "Open this page in Alcove to use files." };
        if (r.error) { load({ path: "", name: "Untitled.md" }, "", undefined); say(r.error, 6000); }
        else load({ path: r.path, name: base(r.path) }, r.text, "view");
      } else {
        let draft = ""; try { draft = localStorage.getItem(DRAFT) || ""; } catch {}
        load({ path: "", name: "Untitled.md" }, "", undefined);
        if (draft) { ta.value = draft; if (visual()) renderVisual(); paint(); say("Restored your last draft"); }
        if (location.hash === "#open") { history.replaceState(null, "", location.pathname); openFile(); }
        else if (location.hash === "#folder") { history.replaceState(null, "", location.pathname); chooseFolder(); }
      }
      let remembered = [];
      if (!q && !location.hash) {
        try { remembered = JSON.parse(localStorage.getItem(FOLDERS) || "[]"); } catch {}
        const old = localStorage.getItem(FOLDER); // from before several folders could be loaded
        if (!remembered.length && old) remembered = [old];
      }
      await restoreFolders([...new Set(remembered)].filter(d => d !== dir));
      if (dir) { setSide(true, "files"); await restoreFolders([dir], false); }
    })();
  </script>
</body>
</html>
