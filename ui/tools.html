<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tools</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { display: block; height: 100%; margin: 0; padding: 0; background: var(--bg) !important; user-select: none; }
    .shell { display: flex; flex-direction: column; height: 100%; }
    .bar { display: flex; align-items: center; gap: 18px; padding: 14px 28px; border-bottom: 1px solid var(--border); flex: none; }
    .bar h1 { font-size: 18px; margin: 0; }
    .bar nav { display: flex; gap: 2px; padding: 3px; background: var(--active); border-radius: 11px; }
    .bar nav button { padding: 5px 15px; border-radius: 8px; color: var(--muted); font-size: 13px; }
    .bar nav button:hover { background: transparent; color: var(--text); }
    .bar nav button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px #0003; }
    .bar .spacer { flex: 1; }
    main { flex: 1; overflow-y: auto; padding: 22px 28px 60px; }
    #view.t-view { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 14px; align-items: start; max-width: 1020px; margin: 0 auto; padding: 0; }
    #view .t-card { background: var(--surface); }
    #view .t-card.wide { grid-column: 1 / -1; }
    .t-big { font-size: 34px; }
    .t-notes { min-height: 300px; }
    .todos { display: flex; flex-direction: column; gap: 1px; }
    .todo { display: flex; align-items: center; gap: 10px; padding: 5px 4px; border-radius: 8px; }
    .todo:hover { background: var(--hover); }
    .todo input[type=checkbox] { width: 16px; height: 16px; padding: 0; flex: none; accent-color: var(--accent); cursor: pointer; }
    .todo-text { flex: 1; min-width: 0; overflow-wrap: anywhere; user-select: text; cursor: text; }
    .todo.done .todo-text { color: var(--muted); text-decoration: line-through; }
    .todo .icon { opacity: 0; }
    .todo:hover .icon { opacity: 1; }
    .todo-edit { flex: 1; padding: 3px 8px; }
    .md-recent { display: flex; flex-direction: column; gap: 2px; }
    .md-recent button { display: flex; flex-direction: column; align-items: flex-start; text-align: left; padding: 6px 10px; }
    .md-recent .d { color: var(--muted); font-size: 11.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="bar">
      <h1>Tools</h1>
      <nav id="nav"></nav>
      <span class="spacer"></span>
      <button id="close" class="icon" title="Close (Esc)"><svg><use href="#i-x"/></svg></button>
    </div>
    <main><div id="view" class="t-view"></div></main>
  </div>
  <svg width="0" height="0" style="position:absolute"><defs>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  </defs></svg>
  <div id="toast" class="toast" hidden></div>
  <script src="tools-shared.js"></script>
  <script src="tools-page.js"></script>
</body>
</html>
