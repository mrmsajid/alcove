<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tools</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { display: block; height: 100%; margin: 0; padding: 0; background: var(--bg) !important; user-select: none; }
    .shell { display: flex; flex-direction: column; height: 100%; }
    .bar { display: flex; align-items: center; gap: 18px; padding: 14px 28px; border-bottom: 1px solid var(--border); flex: none; }
    .bar h1 { font-size: 18px; margin: 0; }
    .bar nav { display: flex; gap: 2px; padding: 3px; background: var(--active); border-radius: 11px; }
    .bar nav button { padding: 5px 15px; border-radius: 8px; color: var(--muted); font-size: 13px; }
    .bar nav button:hover { background: transparent; color: var(--text); }
    .bar nav button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px #0003; }
    .bar .spacer { flex: 1; }
    main { flex: 1; overflow-y: auto; padding: 22px 28px 60px; }
    #view.t-view { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(310px, 100%), 1fr)); gap: 14px; align-items: start; max-width: 1020px; margin: 0 auto; padding: 0; }
    #view .t-card { background: var(--surface); }
    #view .t-card.wide { grid-column: 1 / -1; }
    .t-big { font-size: 34px; }
    /* Narrow: the page sits beside the sidebar, so it can be a third of the window. The tabs get their own row. */
    @media (max-width: 600px) {
      .bar { flex-wrap: wrap; gap: 10px 12px; padding: 12px 16px; }
      .bar h1 { font-size: 16px; }
      .bar nav { order: 3; flex: 1 0 100%; flex-wrap: wrap; overflow: visible; } /* every tab visible, none hidden off to the side */
      main { padding: 16px 14px 48px; }
    }
    .bar nav { overflow-x: auto; scrollbar-width: none; }
    .bar nav button { flex: none; }
    .dialcard { align-items: center; text-align: center; }
    .dialcard .t-title { align-self: flex-start; }
    .dialcard .t-btns, .dialcard .t-chips, .dialcard .t-row { justify-content: center; }
    .dial text, .ring text, .dial-face, .dial-btn, .hand-hub { stroke: none; } /* style.css gives every svg an outline: not wanted here */
    .ring.timer .ring-prog { stroke: #4c8dff; }
    .ring.idle .ring-prog { stroke: var(--border); }
    .dial, .ring { width: 100%; max-width: 250px; height: auto; display: block; overflow: visible; }
    .ring { max-width: 220px; }
    .dial-case { fill: var(--active); stroke: var(--border); stroke-width: 2; }
    .dial-face { fill: var(--bg); }
    .dial-btn { fill: var(--muted); }
    .tick { stroke: var(--muted); stroke-width: 1; stroke-linecap: round; }
    .tick.major { stroke: var(--text); stroke-width: 2; }
    .dial-num { fill: var(--muted); font: 600 9.5px -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
    .sub-ring { fill: none; stroke: var(--border); stroke-width: 1.5; }
    .dial-read { fill: var(--text); font: 600 19px ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; font-variant-numeric: tabular-nums; }
    .hand-sec { stroke: #ff5a4d; stroke-width: 2.2; stroke-linecap: round; }
    .hand-min { stroke: var(--text); stroke-width: 1.8; stroke-linecap: round; }
    .hand-hub { fill: #ff5a4d; }
    .ring-track { fill: none; stroke: var(--active); stroke-width: 12; }
    .ring-prog { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round; transition: stroke .3s; }
    .ring.pomo.focus .ring-prog { stroke: #ff6b5e; }
    .ring.pomo.break .ring-prog { stroke: #34c759; }
    .ring-time { fill: var(--text); font: 600 40px ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; font-variant-numeric: tabular-nums; }
    .ring-sub { fill: var(--muted); font: 13px -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
    .pips { display: flex; gap: 9px; justify-content: center; }
    .pip { width: 10px; height: 10px; border-radius: 50%; background: var(--active); border: 1px solid var(--border); }
    .pip.done { background: #ff6b5e; border-color: #ff6b5e; }
    .pip.now { box-shadow: 0 0 0 3px #ff6b5e55; }
    .cfgs { display: flex; gap: 8px; justify-content: center; }
    .cfg { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
    .cfg input { width: 58px; text-align: center; padding: 4px 6px; }
    .laps { width: 100%; max-height: 160px; overflow: auto; display: flex; flex-direction: column; font: 12.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .lap { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 4px 8px; border-top: 1px solid var(--border); text-align: right; }
    .lap span:first-child { text-align: left; }
    .lap .d { color: var(--muted); }
    .lap.best { color: #34c759; } .lap.worst { color: #ff6b5e; }
    .alarms { display: flex; flex-direction: column; }
    .alarm { display: flex; align-items: center; gap: 14px; padding: 10px 4px; border-top: 1px solid var(--border); }
    .alarm:first-child { border-top: 0; }
    .alarm .at { font: 600 26px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; min-width: 104px; }
    .alarm .al { flex: 1; min-width: 0; }
    .alarm.off .at, .alarm.off .al > div:first-child { color: var(--muted); }
    .t-switch { flex: none; width: 40px; height: 22px; padding: 0; border-radius: 999px; background: var(--active); border: 1px solid var(--border); position: relative; }
    .t-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
    .t-switch.on { background: var(--accent); border-color: var(--accent); }
    .t-switch.on::after { transform: translateX(18px); background: #fff; }
    .alarm-form { display: flex; flex-direction: column; gap: 10px; }
    .t-time { width: 130px !important; flex: none !important; }
    .alarm-sec { display: flex; flex-direction: column; gap: 8px; }
    .alarm-sec.t-row { flex-direction: row; }
    .t-dom { width: 110px; padding: 5px 8px; }
    .t-row.spaced { justify-content: space-between; }
    .t-card.ringing { border-color: #ff5f57; animation: ringpulse 1s ease-in-out infinite; }
    .ring-name { font-size: 22px; font-weight: 600; }
    @keyframes ringpulse { 0%, 100% { box-shadow: 0 0 0 0 #ff5f5766; } 50% { box-shadow: 0 0 0 8px #ff5f5700; } }
    .t-notes { min-height: 300px; }
    .todos { display: flex; flex-direction: column; gap: 1px; }
    .todo { display: flex; align-items: center; gap: 10px; padding: 5px 4px; border-radius: 8px; }
    .todo:hover { background: var(--hover); }
    .todo input[type=checkbox] { width: 16px; height: 16px; padding: 0; flex: none; accent-color: var(--accent); cursor: pointer; }
    .todo-text { flex: 1; min-width: 0; overflow-wrap: anywhere; user-select: text; cursor: text; }
    .todo.done .todo-text { color: var(--muted); text-decoration: line-through; }
    .todo .icon { opacity: 0; }
    .todo:hover .icon { opacity: 1; }
    .todo-edit { flex: 1; padding: 3px 8px; }
    .md-recent { display: flex; flex-direction: column; gap: 2px; }
    .md-recent button { display: flex; flex-direction: column; align-items: flex-start; text-align: left; padding: 6px 10px; }
    .md-recent .d { color: var(--muted); font-size: 11.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="bar">
      <h1>Tools</h1>
      <nav id="nav"></nav>
      <span class="spacer"></span>
      <button id="close" class="icon" title="Close (Esc)"><svg><use href="#i-x"/></svg></button>
    </div>
    <main><div id="view" class="t-view"></div></main>
  </div>
  <svg width="0" height="0" style="position:absolute"><defs>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  </defs></svg>
  <div id="toast" class="toast" hidden></div>
  <script src="tools-shared.js"></script>
  <script src="tools-page.js"></script>
</body>
</html>
