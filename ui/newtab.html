<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <style>
    /* Alcove's start page: a search bar on top, pinned websites, today's report, the tools. Self-contained: it is a
       normal tab, so it can't use the sidebar's stylesheet. The palette matches the Tools page. */
    :root {
      color-scheme: dark light;
      --bg: #1d1d20; --surface: #2a2a2e; --hover: #ffffff0b; --border: #ffffff12; --text: #ededf0; --muted: #8e8e97;
      --active: #ffffff15; --accent: #76767f; --shadow: 0 10px 32px #00000066; --live: #34c759;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #ececef; --surface: #ffffff; --hover: #0000000a; --border: #00000012; --text: #1c1c1f; --muted: #6e6e78; --active: #0000000f; --shadow: 0 10px 32px #0000001c; }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
      font: 14px/1.4 -apple-system, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
    /* The sidebar floats over this page, so main.js says how much of the left edge it covers (--inset, live while it
       slides). The page is centred in the rest, and sizes itself to that space with container queries. */
    body { padding-left: var(--inset, 0px); }
    main { max-width: 940px; margin: 0 auto; padding: clamp(28px, 8vh, 80px) clamp(14px, 3vw, 28px) 64px; container-type: inline-size; }
    svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    button { font: inherit; color: inherit; }
    section { margin-top: 40px; }

    /* search */
    #search { position: relative; max-width: 700px; margin: 0 auto 34px; }
    #search > svg { position: absolute; left: 20px; top: 17px; width: 20px; height: 20px; color: var(--muted); pointer-events: none; transition: color .15s; }
    #search:focus-within > svg { color: var(--text); }
    #q { width: 100%; height: 54px; padding: 0 140px 0 52px; border-radius: 27px; border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font: inherit; font-size: 16px; box-shadow: var(--shadow); outline: none; user-select: text; -webkit-user-select: text;
      transition: border-color .15s, box-shadow .15s; }
    #q::placeholder { color: var(--muted); }
    #q:focus { border-color: color-mix(in srgb, var(--accent) 75%, transparent);
      box-shadow: var(--shadow), 0 0 0 4px color-mix(in srgb, var(--accent) 24%, transparent); }
    #engine { position: absolute; right: 20px; top: 0; height: 54px; display: flex; align-items: center; font-size: 12.5px; color: var(--muted); pointer-events: none; }

    /* shortcuts */
    #shortcuts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 10px; margin: 0 auto; max-width: 820px; }
    .sc { position: relative; width: 92px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 4px 8px; border-radius: 16px;
      color: inherit; text-decoration: none; cursor: pointer; outline: none; transition: background .15s, transform .15s; }
    .sc:hover, .sc:focus-visible { background: var(--hover); }
    .sc.over { background: var(--active); }
    .sc .fav { width: 52px; height: 52px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
      font-size: 21px; font-weight: 600; color: #fff; overflow: hidden; box-shadow: 0 2px 8px #0000001f; }
    .sc .fav img { width: 28px; height: 28px; object-fit: contain; }
    .sc .label { max-width: 100%; font-size: 12.5px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sc .acts { position: absolute; top: 4px; right: 8px; display: none; gap: 3px; }
    .sc:hover .acts, .sc:focus-within .acts { display: flex; }
    .sc .acts button { width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--muted);
      display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .sc .acts button:hover { color: var(--text); background: var(--active); }
    .sc .acts svg { width: 11px; height: 11px; stroke-width: 2; }
    .sc.add .fav { background: transparent; border: 1.5px dashed var(--border); color: var(--muted); box-shadow: none; }
    .sc.add .fav svg { width: 22px; height: 22px; }
    .sc.add { color: var(--muted); }

    /* section headers */
    .sh { display: flex; align-items: center; gap: 12px; margin: 0 0 14px 4px; }
    h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .sh .when { font-size: 12.5px; color: var(--muted); }
    .sh .grow { flex: 1; }
    .ghost { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: transparent; font-size: 12.5px; color: var(--muted); cursor: pointer; transition: background .15s, color .15s; }
    .ghost:hover { background: var(--active); color: var(--text); }

    /* today */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr)); gap: 12px; }
    .stat { padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .stat .val { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
    .stat .lab { font-size: 12.5px; color: var(--muted); }
    .stat .sub { font-size: 12px; color: var(--muted); min-height: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--live); margin-right: 6px; vertical-align: 1px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .details { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(290px, 100%), 1fr)); gap: 12px; margin-top: 12px; }
    .dcard { padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); }
    .dcard h3 { margin: 0 0 10px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline; padding: 4px 0; font-size: 13px; }
    .row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .t { color: var(--muted); font-variant-numeric: tabular-nums; }
    .row .bar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--active); overflow: hidden; }
    .row .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }

    /* tools */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 14px; }
    .tile { display: flex; flex-direction: column; gap: 14px; padding: 16px; min-height: 118px; border-radius: 18px; background: var(--surface);
      border: 1px solid var(--border); cursor: pointer; outline: none; transition: transform .15s, border-color .15s, background .15s; }
    .tile:hover, .tile:focus-visible { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
    .tile:active { transform: none; }
    .head { display: flex; align-items: center; gap: 12px; }
    .ico { width: 38px; height: 38px; border-radius: 11px; background: var(--active); display: flex; align-items: center; justify-content: center; flex: none; }
    .name { font-weight: 600; font-size: 15px; }
    .desc { color: var(--muted); font-size: 12.5px; }
    .status { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .line { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .line b { font-weight: 600; font-variant-numeric: tabular-nums; }
    .line span { color: var(--muted); font-size: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--active); font-size: 12.5px; cursor: pointer; transition: background .15s; }
    .chips button:hover { background: color-mix(in srgb, var(--accent) 30%, var(--active)); }

    /* add / edit a shortcut */
    dialog { left: var(--inset, 0px); /* centred in the space the sidebar leaves */ width: 360px; max-width: calc(100vw - var(--inset, 0px) - 32px); padding: 20px; border-radius: 18px; border: 1px solid var(--border); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
    dialog::backdrop { background: #0000006b; }
    dialog h3 { margin: 0 0 14px; font-size: 15px; }
    dialog label { display: block; margin-bottom: 12px; font-size: 12.5px; color: var(--muted); }
    dialog input { display: block; width: 100%; margin-top: 5px; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font: inherit; font-size: 14px; outline: none; user-select: text; -webkit-user-select: text; }
    dialog input:focus { border-color: color-mix(in srgb, var(--accent) 75%, transparent); }
    dialog .err { min-height: 18px; margin: -4px 0 6px; font-size: 12px; color: #ff6b5e; }
    dialog .btns { display: flex; justify-content: flex-end; gap: 8px; }
    dialog .btns button { padding: 7px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--active); cursor: pointer; }
    dialog .btns button.primary { background: var(--accent); border-color: transparent; color: #fff; }
    @container (max-width: 560px) {
      #search { margin-bottom: 24px; }
      #q { height: 48px; padding: 0 18px 0 46px; font-size: 15px; border-radius: 24px; }
      #search > svg { left: 17px; top: 14px; }
      #engine { display: none; }
      section { margin-top: 30px; }
      .sc { width: 78px; }
      .sc .fav { width: 46px; height: 46px; border-radius: 14px; }
      .sh { flex-wrap: wrap; row-gap: 6px; }
      .stat { padding: 12px 14px; }
      .stat .val { font-size: 22px; }
      .tile { padding: 14px; gap: 12px; min-height: 0; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <main>
    <form id="search" autocomplete="off" role="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Search or enter address" aria-label="Search or enter address" spellcheck="false" autofocus>
      <div id="engine"></div>
    </form>

    <div id="shortcuts"></div>

    <section>
      <div class="sh"><h2>Today</h2><span class="when" id="when"></span><span class="grow"></span><button class="ghost" id="copy" title="Copy today's report as text">Copy report</button></div>
      <div class="stats" id="stats"></div>
      <div class="details" id="details"></div>
    </section>

    <section>
      <div class="sh"><h2>Tools</h2></div>
      <div class="grid" id="tools"></div>
    </section>
  </main>

  <dialog id="dlg">
    <form id="scform" autocomplete="off">
      <h3 id="dlgTitle">Add shortcut</h3>
      <label>Address<input id="scUrl" type="text" placeholder="example.com" spellcheck="false"></label>
      <label>Name (optional)<input id="scName" type="text" maxlength="40" spellcheck="false"></label>
      <div class="err" id="scErr"></div>
      <div class="btns"><button type="button" id="scCancel">Cancel</button><button type="submit" class="primary">Save</button></div>
    </form>
  </dialog>

  <script src="engines.js"></script>
  <script src="tools-shared.js"></script>
  <script>
    const bridge = window.alcoveStart || {};
    const { alarmDue, loadState, clock, timerLeft, pomoLeft, swMs, zoneInfo, today } = ToolsShared;
    const $ = id => document.getElementById(id);
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
    const parse = (s, d) => { try { return JSON.parse(s) ?? d; } catch { return d; } };
    const dlg = $("dlg");

    // ---- search: the same rules as the address bar ----
    let settings = {};
    const input = $("q");
    function normalize(raw) {
      const v = raw.trim();
      if (!v) return null;
      if (/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) return v;
      if (!/\s/.test(v) && /^[^\s]+\.[a-z]{2,}(:\d+)?(\/.*)?$/i.test(v)) return "https://" + v;
      if (/^localhost(:\d+)?(\/.*)?$/i.test(v)) return "http://" + v;
      return searchUrl(settings, v);
    }
    $("search").addEventListener("submit", e => {
      e.preventDefault();
      const url = normalize(input.value);
      if (url) location.href = url;
    });
    input.addEventListener("keydown", e => { if (e.key === "Escape") input.value = ""; });
    // Typing anywhere starts a search.
    window.addEventListener("keydown", e => {
      const a = document.activeElement;
      // Not while a control has the focus: Space presses the button or tile that has it, it doesn't start a search.
      if (dlg.open || e.metaKey || e.ctrlKey || e.altKey || e.key.length !== 1 || /^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/.test(a.tagName) || a.getAttribute("role") === "link") return;
      input.focus();
    });
    Promise.resolve(bridge.settings && bridge.settings()).then(s => {
      settings = s || {};
      if (settings.accent) document.documentElement.style.setProperty("--accent", settings.accent);
      const name = settings.searchEngine === "custom" ? "Custom search" : (ENGINES[settings.searchEngine] || ENGINES.duckduckgo).name;
      $("engine").textContent = name;
      input.placeholder = `Search ${name} or enter address`;
    }).catch(() => {});

    // ---- shortcuts: websites pinned here, kept by the app (shared with "Add to Start Page" in the menus) ----
    let shortcuts = [];
    let shown = "";
    let dragFrom = -1;
    let editing = -1; // index being edited; -1 = adding
    const hueOf = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
    const saveShortcuts = async list => {
      shortcuts = list;
      renderShortcuts();
      try { shortcuts = (await bridge.setShortcuts(list)) || list; } catch {}
      renderShortcuts();
    };
    const ICON = {
      plus: '<path d="M12 5v14M5 12h14"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>', pen: '<path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/>',
    };
    const svg = d => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.innerHTML = d; return s; }; // d is fixed markup above
    const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };

    function renderShortcuts() {
      const key = JSON.stringify(shortcuts);
      shown = key;
      const tiles = shortcuts.map((sc, i) => {
        const a = el("a", "sc");
        a.href = sc.url;
        a.draggable = true;
        a.title = sc.url;
        const fav = el("div", "fav", (sc.name || hostOf(sc.url) || "?")[0].toUpperCase());
        fav.style.background = `hsl(${hueOf(hostOf(sc.url))} 42% 40%)`;
        try { // the site's own icon, the way the sidebar's tabs get theirs; the letter stays if it has none
          const img = new Image();
          img.onload = () => { fav.style.background = "var(--surface)"; fav.replaceChildren(img); };
          img.src = new URL(sc.url).origin + "/favicon.ico";
        } catch {}
        const acts = el("div", "acts");
        const edit = el("button"), del = el("button");
        edit.title = "Edit"; del.title = "Remove";
        edit.append(svg(ICON.pen)); del.append(svg(ICON.x));
        edit.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); openDialog(i); });
        del.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); saveShortcuts(shortcuts.filter((_, k) => k !== i)); });
        acts.append(edit, del);
        a.append(fav, el("div", "label", sc.name), acts);
        a.addEventListener("dragstart", e => { dragFrom = i; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", sc.url); });
        a.addEventListener("dragover", e => { if (dragFrom >= 0) { e.preventDefault(); a.classList.add("over"); } });
        a.addEventListener("dragleave", () => a.classList.remove("over"));
        a.addEventListener("drop", e => {
          e.preventDefault();
          a.classList.remove("over");
          if (dragFrom < 0 || dragFrom === i) return;
          const next = [...shortcuts];
          next.splice(i, 0, next.splice(dragFrom, 1)[0]);
          dragFrom = -1;
          saveShortcuts(next);
        });
        a.addEventListener("dragend", () => { dragFrom = -1; });
        return a;
      });
      const add = el("a", "sc add");
      add.tabIndex = 0;
      add.title = "Add a shortcut";
      const plus = el("div", "fav");
      plus.append(svg(ICON.plus));
      add.append(plus, el("div", "label", "Add site"));
      add.addEventListener("click", e => { e.preventDefault(); openDialog(-1); });
      add.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDialog(-1); } });
      $("shortcuts").replaceChildren(...tiles, ...(shortcuts.length < 24 ? [add] : []));
    }
    function openDialog(i) {
      editing = i;
      $("dlgTitle").textContent = i < 0 ? "Add shortcut" : "Edit shortcut";
      $("scUrl").value = i < 0 ? "" : shortcuts[i].url;
      $("scName").value = i < 0 ? "" : shortcuts[i].name;
      $("scErr").textContent = "";
      dlg.showModal();
      $("scUrl").focus();
      $("scUrl").select();
    }
    $("scCancel").addEventListener("click", () => dlg.close());
    $("scform").addEventListener("submit", e => {
      e.preventDefault();
      let v = $("scUrl").value.trim();
      if (v && !/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v = "https://" + v;
      let u;
      try { u = new URL(v); } catch {}
      if (!u || !/^https?:$/.test(u.protocol) || !/\.|^localhost$/.test(u.hostname)) { $("scErr").textContent = "Enter a website address, like example.com"; return; }
      const item = { name: $("scName").value.trim() || hostOf(u.href), url: u.href };
      if (shortcuts.some((x, k) => x.url === item.url && k !== editing)) { $("scErr").textContent = "That website is already here"; return; }
      saveShortcuts(editing < 0 ? [...shortcuts, item] : shortcuts.map((x, k) => (k === editing ? item : x)));
      dlg.close();
    });
    const loadShortcuts = async () => {
      try {
        const list = (await bridge.shortcuts()) || [];
        if (JSON.stringify(list) !== shown && !dlg.open && dragFrom < 0) { shortcuts = list; renderShortcuts(); }
      } catch {}
    };

    // ---- today: a live report from the Tools engine, the to-do list, the Markdown editor and time tracking ----
    let st = loadState({});                  // the Tools engine lives in the sidebar; its saved data comes through the bridge
    let data = { time: { days: {} }, todos: {}, done: {} };
    const mdDone = () => parse(localStorage.getItem("alcove-md-done-v1"), {})[today()] || 0; // written by the Markdown editor (same storage)
    const dur = sec => {
      sec = Math.max(0, Math.round(sec));
      const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
      return h ? `${h}h ${String(m).padStart(2, "0")}m` : m ? `${m}m ${String(s).padStart(2, "0")}s` : `${s}s`;
    };
    function report() {
      const day = today();
      const todosDone = (data.done[day] && data.done[day].todos) || 0;
      const todosOpen = Object.values(data.todos).reduce((n, list) => n + (Array.isArray(list) ? list.filter(x => !x.done).length : 0), 0);
      const t = data.time.days[day] || {};
      const browse = Object.values(t.spaces || {}).reduce((a, b) => a + b, 0);
      const sites = Object.entries(t.sites || {}).sort((a, b) => b[1] - a[1]);
      const tasks = ((st.log && st.log[day]) || []).map(x => ({ ...x }));
      if (st.task) { // the task being timed right now counts while it runs
        const sec = (Date.now() - st.task.start) / 1000, same = tasks.find(x => x.name === st.task.name);
        if (same) same.sec += sec; else tasks.push({ name: st.task.name, sec });
      }
      tasks.sort((a, b) => b.sec - a.sec);
      return {
        todosDone, todosOpen, md: mdDone(), browse, sites, tasks, taskSec: tasks.reduce((a, x) => a + x.sec, 0),
        pomos: st.pomoDone && st.pomoDone.date === day ? st.pomoDone.n : 0, running: st.task,
      };
    }
    const reportText = r => {
      const lines = [`Daily report · ${new Date().toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" })}`,
        `To-dos done: ${r.todosDone} (${r.todosOpen} open)`, `Markdown to-dos done: ${r.md}`, `Browsing time: ${dur(r.browse)}`,
        `Task time: ${dur(r.taskSec)}`, `Pomodoros: ${r.pomos}`];
      if (r.tasks.length) lines.push("", "Tasks", ...r.tasks.slice(0, 8).map(x => `- ${x.name}: ${dur(x.sec)}`));
      if (r.sites.length) lines.push("", "Top sites", ...r.sites.slice(0, 5).map(([h, s]) => `- ${h}: ${dur(s)}`));
      return lines.join("\n");
    };
    const STATS = [
      ["todos", "To-dos done"], ["md", "Markdown to-dos"], ["browse", "Browsing time"], ["tasks", "Task time"], ["pomos", "Pomodoros"],
    ];
    const statNodes = {};
    for (const [id, label] of STATS) {
      const card = el("div", "stat"), val = el("div", "val", "0"), sub = el("div", "sub");
      card.append(val, el("div", "lab", label), sub);
      statNodes[id] = { val, sub };
      $("stats").append(card);
    }
    function detailCard(title, rows) {
      const card = el("div", "dcard");
      card.append(el("h3", "", title));
      const max = Math.max(...rows.map(r => r[1]), 1);
      for (const [name, sec] of rows) {
        const row = el("div", "row"), bar = el("div", "bar"), fill = el("i");
        fill.style.width = `${Math.max(3, Math.round(sec / max * 100))}%`;
        bar.append(fill);
        row.append(el("div", "n", name), el("div", "t", dur(sec)), bar);
        card.append(row);
      }
      return card;
    }
    function renderToday() {
      const r = report();
      $("when").textContent = new Date().toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
      statNodes.todos.val.textContent = r.todosDone;
      statNodes.todos.sub.textContent = `${r.todosOpen} open`;
      statNodes.md.val.textContent = r.md;
      statNodes.md.sub.textContent = "done in the editor";
      statNodes.browse.val.textContent = dur(r.browse);
      statNodes.browse.sub.textContent = r.sites[0] ? `most on ${r.sites[0][0]}` : "active time on websites";
      statNodes.tasks.val.textContent = dur(r.taskSec);
      const sub = statNodes.tasks.sub;
      if (r.running) { sub.replaceChildren(el("span", "dot"), document.createTextNode(`${r.running.name} · ${clock(Date.now() - r.running.start)}`)); }
      else sub.textContent = "from Tools › Track";
      statNodes.pomos.val.textContent = r.pomos;
      statNodes.pomos.sub.textContent = st.pomo && st.pomo.phase ? `${st.pomo.phase === "work" ? "focus" : "break"} ${clock(pomoLeft(st))}` : "";
      const cards = [];
      if (r.tasks.length) cards.push(detailCard("Tasks", r.tasks.slice(0, 5).map(x => [x.name, x.sec])));
      if (r.sites.length) cards.push(detailCard("Top sites", r.sites.slice(0, 5)));
      $("details").replaceChildren(...cards);
    }
    let copyTimer;
    $("copy").addEventListener("click", async () => {
      try { await bridge.copy(reportText(report())); $("copy").textContent = "Copied"; } catch { $("copy").textContent = "Couldn't copy"; }
      clearTimeout(copyTimer);
      copyTimer = setTimeout(() => { $("copy").textContent = "Copy report"; }, 1600);
    });
    window.addEventListener("storage", e => { if (e.key === "alcove-md-done-v1") renderToday(); }); // a to-do ticked in a Markdown tab

    const refreshState = async () => {
      try {
        const raw = parse(await bridge.toolsData(), []);
        st = loadState(parse(raw[0], {}));
        data = { time: parse(raw[1], { days: {} }), todos: parse(raw[2], {}), done: parse(raw[3], {}) };
      } catch { st = loadState({}); }
      tick();
    };

    // ---- tools ----
    const ICONS = {
      timers: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/>',
      alarms: '<path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9zM10 20a2 2 0 0 0 4 0"/>',
      track: '<path d="M5 20v-9M12 20V4M19 20v-6"/>',
      clocks: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
      notes: '<path d="M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h7"/>',
      markdown: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M6.5 15V9l2.5 3 2.5-3v6M16 9v6M14 13l2 2 2-2"/>',
      page: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M6.5 6.5h.01M9.5 6.5h.01"/>',
    };
    const MINUTES = [5, 15, 25];

    // Each tool: how it looks, what it does when clicked, and (optionally) a status that follows the saved state.
    const TOOLS = [
      { id: "timers", name: "Timers", desc: "Timer, stopwatch, Pomodoro", open: () => bridge.openTools("timers"), body: tile => {
          const lines = el("div", "status"), chips = el("div", "chips");
          for (const m of MINUTES) {
            const b = el("button", "", `${m} min`);
            b.addEventListener("click", e => { e.stopPropagation(); bridge.startTimer(m); setTimeout(refreshState, 250); });
            chips.append(b);
          }
          const p = el("button", "", "Pomodoro");
          p.addEventListener("click", e => { e.stopPropagation(); bridge.startPomodoro(); setTimeout(refreshState, 250); });
          chips.append(p);
          tile.append(lines, chips);
          return () => {
            const rows = [];
            if (st.timer.end || st.timer.left) rows.push(["Timer", clock(timerLeft(st)), st.timer.end ? "left" : "paused"]);
            if (st.pomo.phase) rows.push([st.pomo.phase === "work" ? "Focus" : "Break", clock(pomoLeft(st)), st.pomo.end ? "left" : "paused"]);
            if (st.sw.start || st.sw.acc) rows.push(["Stopwatch", clock(swMs(st)), st.sw.start ? "running" : "stopped"]);
            lines.replaceChildren(...rows.map(([a, b, c]) => { const l = el("div", "line"); l.append(el("b", "", `${a} ${b}`), el("span", "", c)); return l; }));
            chips.hidden = !!(st.timer.end || st.timer.left);
          };
        } },
      { id: "alarms", name: "Alarms", desc: "Once, daily, weekly or monthly", open: () => bridge.openTools("alarms"), body: tile => {
          const line = el("div", "status");
          tile.append(line);
          return () => {
            const n = nextAlarm();
            line.replaceChildren(el("div", "desc", n ? `Next: ${n}` : "No alarms set"));
          };
        } },
      { id: "track", name: "Track", desc: "Time on sites, tasks, focus mode", open: () => bridge.openTools("track"), body: tile => {
          const line = el("div", "status");
          tile.append(line);
          return () => {
            const left = st.focusUntil - Date.now();
            const text = left > 0 ? `Focus mode on · ${clock(left)} left` : st.task ? `Working on “${st.task.name}” · ${clock(Date.now() - st.task.start)}` : "";
            line.replaceChildren(...(text ? [el("div", "desc", text)] : []));
          };
        } },
      { id: "clocks", name: "Clocks", desc: "World clock", open: () => bridge.openTools("clocks"), body: tile => {
          const rows = el("div", "status");
          tile.append(rows);
          return () => rows.replaceChildren(...(st.zones || []).slice(0, 3).map(([tz, label]) => {
            let info; try { info = zoneInfo(tz); } catch { return el("div"); }
            const l = el("div", "line");
            l.append(el("span", "", label), el("b", "", info.time));
            return l;
          }));
        } },
      { id: "notes", name: "Notes", desc: "Notes and to-dos for each space", open: () => bridge.openTools("notes") },
      { id: "markdown", name: "Markdown", desc: "Write and open Markdown files", open: () => bridge.openMarkdown() },
      { id: "page", name: "Page", desc: "Amazon helpers, clean links", open: () => bridge.openTools("page") },
    ];

    function nextAlarm() {
      const now = new Date();
      let best = null;
      for (const a of st.alarms || []) {
        if (!a.on) continue;
        const [h, m] = String(a.time).split(":").map(Number);
        for (let i = 0; i < 35; i++) {
          const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, h, m);
          if (d <= now || !alarmDue(a, d)) continue;
          if (!best || d < best.at) best = { at: d, label: a.label };
          break;
        }
      }
      if (!best) return "";
      const days = Math.round((new Date(best.at.getFullYear(), best.at.getMonth(), best.at.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
      const when = days === 0 ? "today" : days === 1 ? "tomorrow" : best.at.toLocaleDateString([], { weekday: "short" });
      return `${best.at.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })} ${when}${best.label ? " · " + best.label : ""}`;
    }

    const updaters = [];
    for (const t of TOOLS) {
      const tile = el("div", "tile");
      tile.tabIndex = 0;
      tile.setAttribute("role", "link");
      tile.setAttribute("aria-label", t.name);
      const head = el("div", "head"), ico = el("div", "ico"), txt = el("div");
      ico.append(svg(ICONS[t.id]));
      txt.append(el("div", "name", t.name), el("div", "desc", t.desc));
      head.append(ico, txt);
      tile.append(head);
      if (t.body) updaters.push(t.body(tile));
      tile.addEventListener("click", t.open);
      tile.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target === tile) { e.preventDefault(); t.open(); } });
      $("tools").append(tile);
    }

    const tick = () => { renderToday(); for (const u of updaters) u(); };
    renderShortcuts();
    tick();
    loadShortcuts();
    refreshState();
    setInterval(tick, 1000);
    setInterval(refreshState, 2000);
    setInterval(loadShortcuts, 3000);
    input.focus();

    // The floating sidebar covers the page's left edge: lay out right of it, as it slides in and out and the window resizes.
    const setInset = n => document.documentElement.style.setProperty("--inset", `${n}px`);
    if (bridge.onInset) bridge.onInset(setInset);
    Promise.resolve(bridge.inset && bridge.inset()).then(n => { if (typeof n === "number") setInset(n); }).catch(() => {});
  </script>
</body>
</html>
