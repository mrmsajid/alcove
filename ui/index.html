<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alcove</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="glass-bg"><div id="glass-img"></div></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
      <symbol id="i-forward" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
      <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9L20 8"/><path d="M20 3v5h-5"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.6-3 8.3-7 10-4-1.7-7-5.4-7-10V6z"/></symbol>
      <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7.5 11L12 15.5 16.5 11"/><path d="M5 19h14"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
      <symbol id="i-puzzle" viewBox="0 0 24 24"><path d="M10 4a2 2 0 1 1 4 0v2h4v4h-2a2 2 0 1 0 0 4h2v4h-4v-2a2 2 0 1 0-4 0v2H6v-4h2a2 2 0 1 0 0-4H6V6h4z"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 5 3 3v1H7v-1l3-3z"/><path d="M12 13v7"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-tune" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
      <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="4" rx="1"/><path d="M5 8.5v10a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5v-10"/><path d="M10 12h4"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3c.6 4.6 3.4 7.4 8 8-4.6.6-7.4 3.4-8 8-.6-4.6-3.4-7.4-8-8 4.6-.6 7.4-3.4 8-8z"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
      <symbol id="i-muted" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></symbol>
    </defs>
  </svg>

  <!-- Top row: window buttons (macOS draws its own in the gap on the left), sidebar toggle, navigation.
       Empty space in this row drags the window. -->
  <div id="topbar" class="top">
    <div class="winctl">
      <button class="dot close" data-act="close" title="Close"></button>
      <button class="dot min" data-act="minimize" title="Minimize"></button>
      <button class="dot max" data-act="maximize" title="Maximize"></button>
    </div>
    <button id="toggle-sidebar" class="icon" title="Hide sidebar"><svg><use href="#i-sidebar"/></svg></button>
    <span class="spacer"></span>
    <button id="back" class="icon" title="Back"><svg><use href="#i-back"/></svg></button>
    <button id="forward" class="icon" title="Forward"><svg><use href="#i-forward"/></svg></button>
    <button id="reload" class="icon" title="Reload"><svg><use href="#i-reload"/></svg></button>
  </div>

  <form id="addr-form" class="pill">
    <div id="addr-display" class="addr-display"></div>
    <input id="addr" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
    <button type="button" id="shield" class="icon sm" title="Site settings">
      <svg><use href="#i-tune"/></svg><span id="shield-count"></span>
    </button>
  </form>

  <div id="findbar" class="findbar" hidden>
    <input id="find-input" type="text" spellcheck="false" placeholder="Find in page">
    <button id="find-prev" class="icon sm" title="Previous"><svg><use href="#i-up"/></svg></button>
    <button id="find-next" class="icon sm" title="Next"><svg><use href="#i-down"/></svg></button>
    <button id="find-close" class="icon sm" title="Close"><svg><use href="#i-x"/></svg></button>
  </div>

  <div id="store-banner" class="banner" hidden>
    <span id="store-text"></span>
    <button id="store-add">Add to Alcove</button>
  </div>

  <div id="yt-banner" class="banner" hidden>
    <span id="yt-text">Save this video</span>
    <button id="yt-video">Video</button>
    <button id="yt-audio" class="ghost">Audio</button>
  </div>

  <div id="pinned" class="pinned"></div>
  <div id="space-title" class="space-title"></div>
  <div class="new-row">
    <button id="new-tab" class="new-tab"><svg><use href="#i-plus"/></svg>New Tab</button>
    <button id="new-group" class="icon sm" title="New tab group"><svg><use href="#i-folder"/></svg></button>
  </div>
  <div id="tabs" class="tabs"></div>

  <div id="panel" class="panel" hidden>
    <div class="panel-head">
      <strong id="panel-title"></strong>
      <span class="spacer"></span>
      <button id="panel-clear" class="text-btn" hidden>Clear</button>
      <button id="panel-close" class="icon sm" title="Close"><svg><use href="#i-x"/></svg></button>
    </div>
    <input id="panel-search" type="text" spellcheck="false" placeholder="Search" hidden>
    <div id="panel-body" class="panel-body"></div>
  </div>

  <div class="bottom">
    <div class="b-left">
      <button id="profile" class="avatar" title="Profile"></button>
      <button id="open-library" class="icon sm" title="Library: bookmarks, history, downloads, extensions, screenshot"><svg><use href="#i-archive"/></svg></button>
      <button id="open-palette" class="icon sm" title="Command palette (⌘K)"><svg><use href="#i-sparkle"/></svg></button>
    </div>
    <div id="spaces" class="space-dots"></div>
    <div class="b-right">
      <button id="open-tools" class="icon sm" title="Tools: timers, time tracker, clocks, notes, page helpers (⌘⇧U)"><svg><use href="#i-grid"/></svg><span id="tools-chip"></span></button>
      <button id="new-space" class="icon sm" title="New space"><svg><use href="#i-plus"/></svg></button>
    </div>
  </div>

  <div id="menu" class="ctx" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="engines.js"></script>
  <script src="app.js"></script>
  <script src="tools-shared.js"></script>
  <script src="tools.js"></script>
</body>
</html>
