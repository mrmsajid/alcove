<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { display: block; height: 100%; margin: 0; padding: 0; background: var(--bg) !important; user-select: none; }
    .shell { display: grid; grid-template-columns: 210px 1fr; height: 100%; }
    nav { padding: 20px 12px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
    nav h1 { font-size: 18px; margin: 4px 10px 14px; }
    nav a { display: block; padding: 8px 10px; border-radius: 10px; color: var(--text); text-decoration: none; cursor: pointer; }
    nav a:hover { background: var(--hover); }
    nav a.on { background: var(--active); font-weight: 600; }
    main { overflow-y: auto; padding: 18px 28px 60px; }
    .topline { position: sticky; top: -18px; z-index: 2; display: flex; gap: 10px; align-items: center; padding: 18px 0 12px; margin-top: -18px; background: var(--bg); }
    .topline input { max-width: 380px; }
    .topline .spacer { flex: 1; }
    section { max-width: 760px; margin: 0 0 34px; scroll-margin-top: 70px; }
    section h2 { font-size: 15px; margin: 0 0 10px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .row { display: flex; align-items: center; gap: 16px; padding: 13px 16px; border-top: 1px solid var(--border); cursor: default; border-radius: 0; }
    .row:hover { background: transparent; }
    .card > .row:first-child { border-top: 0; }
    .row .what { flex: 1; min-width: 0; }
    .row .what .t { font-weight: 500; white-space: normal; }
    .row .what .d { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: normal; }
    .ctl { flex: none; display: flex; align-items: center; gap: 8px; }
    .radios { display: flex; flex-direction: column; gap: 2px; padding: 6px; }
    .radio { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; }
    .radio:hover { background: var(--hover); }
    .radio .dot2 { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
    .radio.on .dot2 { border-color: var(--accent); background: radial-gradient(var(--accent) 45%, transparent 50%); }
    .radio .sub2 { color: var(--muted); font-size: 12px; margin-left: auto; }
    .seg { display: inline-flex; background: var(--active); border-radius: 10px; padding: 3px; gap: 2px; }
    .seg button { padding: 5px 12px; border-radius: 8px; color: var(--muted); }
    .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px #0003; }
    .switch { width: 40px; height: 24px; border-radius: 12px; background: var(--active); position: relative; padding: 0; flex: none; transition: background .15s; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px #0004; }
    .switch.on { background: var(--accent); }
    .switch.on::after { transform: translateX(16px); }
    .switch:hover { filter: brightness(1.08); background: var(--active); }
    .switch.on:hover { background: var(--accent); }
    .btn { padding: 6px 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--active); }
    .btn.primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
    .btn.danger { color: #ff6b6b; }
    .swatches { display: flex; gap: 8px; }
    .swatch { width: 22px; height: 22px; border-radius: 50%; padding: 0; border: 2px solid transparent; }
    .swatch.on { border-color: var(--text); }
    select { background: var(--active); color: var(--text); border: 1px solid var(--border); border-radius: 9px; padding: 6px 10px; font: inherit; }
    .inline { padding: 0 16px 12px 42px; }
    .inline input { font-size: 13px; }
    .path { color: var(--muted); font-size: 12px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
    .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; padding: 12px 16px; }
    .checks label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
    .checks input { width: auto; padding: 0; accent-color: var(--accent); }
    .empty { color: var(--muted); padding: 14px 16px; }
    .item-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border); }
    .item-row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pill2 { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--active); color: var(--muted); }
    .pill2.ok { color: #5fd6a0; } .pill2.no { color: #ff7c9c; }
    .keys { display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; padding: 14px 16px; }
    kbd { font: 12px -apple-system, "Segoe UI", sans-serif; color: var(--muted); padding: 2px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
    .about { padding: 16px; line-height: 1.7; }
    .about b { font-size: 16px; }
    .hidden-by-search { display: none !important; }
    .flash { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); padding: 8px 14px; border-radius: 10px; box-shadow: 0 8px 24px #0005; }
  </style>
</head>
<body>
  <div class="shell">
    <nav id="nav"><h1>Settings</h1></nav>
    <main id="main">
      <div class="topline">
        <input id="find" type="text" placeholder="Search settings" spellcheck="false" autocomplete="off">
        <span class="spacer"></span>
        <button id="close" class="btn" title="Close (Esc)">Done</button>
      </div>
      <div id="sections"></div>
    </main>
  </div>
  <div id="flash" class="flash" hidden></div>
  <script src="engines.js"></script>
  <script src="settings.js"></script>
</body>
</html>
